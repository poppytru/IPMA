<style>
    .topic-card { background: #16213e; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; border-left: 4px solid #4fc3f7; }

    .podcast-controls { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; }
    .podcast-controls button { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .podcast-controls .play-btn { background: #4fc3f7; color: #1a1a2e; width: 50px; height: 50px; font-size: 1.3rem; }
    .podcast-controls .skip-btn { background: #0f3460; color: #4fc3f7; }
    .podcast-progress { flex: 1; height: 6px; background: #0f3460; border-radius: 3px; cursor: pointer; position: relative; }
    .podcast-progress-fill { height: 100%; background: #4fc3f7; border-radius: 3px; transition: width 0.3s; }
    .podcast-time { color: #aaa; font-size: 0.8rem; min-width: 80px; text-align: right; }
    .speed-btn { background: #0f3460; color: #4fc3f7; border: 1px solid #4fc3f7; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }

    .timer-display { font-size: 3.5rem; color: #4fc3f7; text-align: center; font-family: 'Courier New', monospace; margin: 1.5rem 0; letter-spacing: 3px; }
    /* Stats */
    .stats-panel { background: #16213e; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.8rem; margin: 1rem 0; }
    .stat-box { background: #0f3460; padding: 1rem; border-radius: 8px; text-align: center; }
    .stat-box .number { font-size: 1.8rem; font-weight: bold; }
    .stat-box .label { color: #aaa; font-size: 0.8rem; margin-top: 0.3rem; }
    /* Tips */
    .tip-card { background: #16213e; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; border-left: 4px solid #ffa726; }

    .tip-card p { color: #ccc; line-height: 1.6; }
    /* Practice */
    .practice-q { background: #16213e; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; }
    .practice-q h4 { color: #4fc3f7; margin-bottom: 1rem; }
    @media(max-width:768px) { .nav { flex-direction: column; gap: 0.5rem; } .topic-grid { grid-template-columns: 1fr; } }
</style>

// ===== NOTES DATA =====
const topicNotes = {
'strategy':{title:'Strategy (CE 4.3.1)',definition:'Aligning the project with organisational strategy, mission, vision and ensuring it delivers business value.',competencies:['Aligning project with organisational strategy','Understanding mission, vision and values','Identifying strategic drivers','Ensuring contribution to portfolio/programme objectives'],models:['PESTLE Analysis (Political, Economic, Social, Technological, Legal, Environmental)','SWOT Analysis (Strengths, Weaknesses, Opportunities, Threats)','Porter\'s Five Forces','Balanced Scorecard (Financial, Customer, Internal Process, Learning & Growth)','Ansoff Matrix (Market Penetration, Development, Product Development, Diversification)'],ideas:['Projects exist to deliver strategic objectives - not just deliverables','Project success = delivering business value, not just on time/budget','Strategy cascade: Vision → Mission → Strategy → Portfolio → Programme → Project','Business case is the golden thread linking project to strategy','Benefits realisation extends beyond project delivery']},
'compliance':{title:'Compliance, Standards & Regulations (CE 4.3.4)',definition:'Identifying and ensuring adherence to all relevant legislation, regulations, standards, agreements and ethical norms.',competencies:['Identifying relevant regulations and standards','Ensuring legal compliance throughout','Understanding professional codes of conduct','Managing health and safety requirements'],models:['ISO 21500 (Project Management guidance)','ISO 31000 (Risk Management)','ICB4 Competence Framework','Regulatory Compliance Framework','Professional Ethics Framework'],ideas:['Compliance is non-negotiable - law overrides project objectives','Standards: mandatory (regulations) vs voluntary (best practice)','GDPR affects most projects handling personal data','H&S is paramount - duty of care cannot be delegated away','Professional ethics: transparency, honesty, responsibility','Environmental legislation increasingly important']},
'self-reflection':{title:'Self-Reflection & Self-Management (CE 4.4.1)',definition:'Recognising personal behaviour, preferences and emotions, understanding their impact, and managing personal effectiveness.',competencies:['Self-awareness and emotional intelligence','Time management and personal organisation','Stress management and resilience','Continuous professional development'],models:['Johari Window (Open, Blind, Hidden, Unknown)','Kolb Learning Cycle (Experience → Reflect → Conceptualise → Experiment)','Eisenhower Matrix (Urgent/Important)','Emotional Intelligence - Goleman (Self-awareness, Self-regulation, Motivation, Empathy, Social skills)','GROW Model for development'],ideas:['Self-awareness is the foundation of leadership','Reflective practice improves future performance','360° feedback identifies blind spots','Work-life balance sustains long-term performance','CPD (Continuous Professional Development) is essential']},
'integrity':{title:'Personal Integrity & Reliability (CE 4.4.2)',definition:'Acting consistently, honestly, transparently and ethically, following through on commitments.',competencies:['Demonstrating ethical behaviour','Building trust through consistent actions','Taking responsibility for decisions','Maintaining confidentiality'],models:['Trust Equation: (Credibility + Reliability + Intimacy) / Self-Orientation','Ethical Decision-Making Framework','Values-Based Leadership'],ideas:['Trust is built through consistent behaviour over time','Reliability = doing what you say you will do','Ethical dilemmas require balancing competing values','Transparency builds credibility','Accountability means owning outcomes - positive AND negative']},
'communication':{title:'Personal Communication (CE 4.4.3)',definition:'Exchanging information, ideas and emotions effectively, adapting communication style to context and audience.',competencies:['Active listening','Clear and concise messaging','Adapting style to audience','Non-verbal communication awareness','Facilitating effective meetings'],models:['Shannon-Weaver Model (Sender → Encode → Channel → Decode → Receiver + Noise)','Mehrabian 7-38-55 Rule (Words, Tone, Body Language)','Communication Planning Matrix (Who, What, When, How, Why)','Push vs Pull vs Interactive Communication'],ideas:['Active listening more important than speaking','~70% of PM time is spent communicating','Tailor message to audience needs','Written communication creates audit trail','Non-verbal cues can contradict verbal messages','Cultural differences affect communication styles']},
'negotiation':{title:'Negotiation (CE 4.4.6)',definition:'Reaching agreements through dialogue, balancing different interests while maintaining relationships.',competencies:['Preparing negotiation strategy','Identifying interests vs positions','Creating win-win solutions','Managing difficult conversations'],models:['Harvard Principled Negotiation (Separate people from problem, Focus on interests, Invent options for mutual gain, Use objective criteria)','BATNA (Best Alternative To a Negotiated Agreement)','Thomas-Kilmann Conflict Modes','ZOPA (Zone of Possible Agreement)'],ideas:['Interests differ from positions - dig deeper','BATNA gives negotiating power','Win-win is the goal for long-term relationships','Preparation is 80% of negotiation success','Silence is a powerful tool','Document all agreements']},
'results':{title:'Results Orientation (CE 4.4.8)',definition:'Focusing on agreed objectives and desired outcomes, making effective decisions and taking action to deliver results.',competencies:['Setting SMART objectives','Making effective decisions','Prioritising activities','Driving delivery with urgency'],models:['SMART Objectives (Specific, Measurable, Achievable, Relevant, Time-bound)','MoSCoW Prioritisation (Must, Should, Could, Won\'t)','PDCA Cycle (Plan-Do-Check-Act)','Decision Matrix / Weighted Scoring'],ideas:['Focus on outcomes not just outputs','Clear success criteria enable measurement','Delayed decisions have costs','Delegation enables focus on high-value activities','Results require balancing quality, time, cost and scope']},
'design':{title:'Project Design (CE 4.5.1)',definition:'Interpreting stakeholder demands and translating them into the high-level design of the project.',competencies:['Interpreting project context','Defining approach and methodology','Establishing success criteria','Designing project governance'],models:['Business Case Structure (Strategic fit, Options, Benefits, Costs, Risks, Timescales)','Project Lifecycle Models (Waterfall, Agile, Hybrid)','Gate Review Process','Feasibility Study Framework'],ideas:['Project design translates strategy into actionable plans','Success criteria agreed upfront with stakeholders','Methodology choice depends on complexity and uncertainty','Lessons learned inform design','Governance must match project complexity']},
'requirements':{title:'Requirements & Objectives (CE 4.5.2)',definition:'Establishing and agreeing project objectives, identifying, analysing and prioritising requirements.',competencies:['Eliciting requirements from stakeholders','Documenting and managing requirements','Prioritising requirements','Managing requirements changes'],models:['Requirements Hierarchy (Business → Stakeholder → Solution → Transition)','MoSCoW Prioritisation','Kano Model (Basic, Performance, Excitement)','User Stories (As a... I want... So that...)','Requirements Traceability Matrix'],ideas:['Requirements define WHAT not HOW','Functional vs Non-functional requirements','Requirements evolve - need change management','Ambiguous requirements cause scope creep','Traceability ensures nothing is lost']},
'scope':{title:'Scope (CE 4.5.3)',definition:'Defining and controlling what is and is not included in the project.',competencies:['Defining project scope','Creating Work Breakdown Structure','Managing scope changes','Preventing scope creep'],models:['Work Breakdown Structure (WBS)','Product Breakdown Structure (PBS)','Scope Statement (Inclusions, Exclusions, Assumptions, Constraints)','Change Control Process','100% Rule'],ideas:['Scope defines boundaries - IN and OUT','WBS is the cornerstone of planning','Scope creep = uncontrolled expansion without change control','Gold plating = adding unrequested features','Configuration management tracks versions','Baseline scope enables change impact assessment']},
'procurement':{title:'Procurement (CE 4.5.13)',definition:'Obtaining the best available goods, services and results from external providers.',competencies:['Make-or-buy decisions','Selecting procurement strategy','Managing contracts','Evaluating supplier performance'],models:['Procurement Lifecycle (Plan → Select → Administer → Close)','Contract Types (Fixed Price, Cost Plus, Time & Materials)','Kraljic Matrix (Leverage, Strategic, Non-critical, Bottleneck)','Tender Evaluation Matrix'],ideas:['Make-or-buy: capability, capacity, cost, control','Fixed price = risk on supplier; Cost plus = risk on buyer','Clear specifications prevent disputes','Relationship management beyond contract compliance','Early supplier involvement improves outcomes']},
'plan-control':{title:'Plan & Control (CE 4.5.5)',definition:'Developing and maintaining plans, monitoring and controlling performance against those plans.',competencies:['Developing integrated project plans','Establishing baselines','Monitoring progress','Earned Value Management'],models:['Earned Value Management (PV, EV, AC → SV, CV → SPI, CPI → EAC)','Gantt Charts','Milestone Planning','Rolling Wave Planning','Tolerance and Exception Reporting'],ideas:['Plans are living documents','Baseline enables variance analysis','EVM integrates scope, time and cost','SPI<1 = behind schedule; CPI<1 = over budget','Tolerances define acceptable variance before escalation','Control = compare actual vs plan and take action']},
'risk':{title:'Risk & Opportunity (CE 4.5.7)',definition:'Identifying, assessing and managing risks and opportunities including implementation of responses.',competencies:['Identifying risks and opportunities','Qualitative and quantitative analysis','Developing response strategies','Maintaining risk register'],models:['Risk Process (Identify → Assess → Plan Responses → Monitor)','Probability-Impact Matrix','Threat Responses (Avoid, Transfer, Mitigate, Accept)','Opportunity Responses (Exploit, Share, Enhance, Accept)','EMV (Expected Monetary Value = Probability × Impact)'],ideas:['Risk = uncertainty that matters (positive or negative)','Opportunities are positive risks','Risk appetite defines acceptable risk level','Residual risk remains after response','Secondary risks created by responses need managing','Risk proximity = when it might occur']},
'change':{title:'Change & Transformation (CE 4.5.10)',definition:'Managing change and transformation enabling adoption of new processes, behaviours and outcomes.',competencies:['Managing organisational change','Building change readiness','Overcoming resistance','Sustaining change outcomes'],models:['Kotter 8 Steps (Urgency → Coalition → Vision → Communicate → Empower → Quick Wins → Consolidate → Anchor)','Lewin (Unfreeze → Change → Refreeze)','ADKAR (Awareness, Desire, Knowledge, Ability, Reinforcement)','Change Curve (Denial → Resistance → Exploration → Commitment)'],ideas:['Change management is about PEOPLE not processes','Resistance is natural - address root causes','Communication is the #1 change enabler','Quick wins build momentum','Senior sponsorship is critical','Benefits only realised when change is adopted']},

'governance':{title:'Governance, Structures & Processes (CE 4.3.2)',definition:'Understanding and applying governance structures and processes ensuring appropriate decision-making and oversight.',competencies:['Understanding organisational governance frameworks','Applying project governance structures','Establishing decision-making processes','Ensuring accountability and reporting'],models:['Project Board / Steering Committee Structure','RACI Matrix (Responsible, Accountable, Consulted, Informed)','Stage-Gate Process','Portfolio/Programme/Project Hierarchy','PMO Functions (Supportive, Controlling, Directive)'],ideas:['Governance provides oversight and decision-making authority','Clear roles prevent confusion - only ONE Accountable per task','Escalation paths defined before issues arise','Project sponsor is the key governance role','Governance proportionate to project complexity','Regular reporting enables informed decisions']},
'power':{title:'Power & Interest (CE 4.3.3)',definition:'Recognising and managing personal and organisational power dynamics and interests that influence project outcomes.',competencies:['Identifying sources of power','Mapping political landscape','Building influence networks','Managing competing interests'],models:['Power/Interest Grid (Mendelow)','French & Raven Sources of Power (Legitimate, Reward, Coercive, Expert, Referent, Informational)','Stakeholder Salience Model (Power, Legitimacy, Urgency)','Influence Strategies (Push/Pull)'],ideas:['Power is not just hierarchical','Hidden agendas can derail projects','Building coalitions creates collective influence','Influence without authority is a key PM skill','Understanding motivations helps manage stakeholders','Political awareness ≠ political manipulation']},

{topic:'risk',q:'Residual risk is:',a:'A risk that has already occurred',b:'The risk remaining after response strategies have been implemented',c:'A risk that has been transferred',d:'An unidentified risk',answer:'b',explain:'After implementing responses (mitigation, etc.), some risk typically remains—this is residual risk, which must be accepted and monitored.'},
{topic:'risk',q:'Expected Monetary Value (EMV) is calculated as:',a:'Cost × Time',b:'Probability × Impact',c:'Budget × Risk Factor',d:'Contingency × Duration',answer:'b',explain:'EMV = Probability × Impact. Used to quantify risks for comparison and to calculate overall project risk exposure.'},
{topic:'risk',q:'A project\'s risk appetite is BEST described as:',a:'How many risks are on the risk register',b:'The amount and type of risk the organisation is prepared to accept in pursuit of objectives',c:'The probability of the biggest risk',d:'The total contingency budget',answer:'b',explain:'Risk appetite is the organisation\'s tolerance for risk—some organisations are risk-averse, others more risk-tolerant.'},
{topic:'change',q:'Kotter\'s 8-step model begins with:',a:'Creating a vision',b:'Forming a guiding coalition',c:'Establishing a sense of urgency',d:'Generating quick wins',answer:'c',explain:'Urgency first: people must understand WHY change is needed before they will engage. Without urgency, complacency prevails.'},
{topic:'change',q:'In Lewin\'s model, "Refreeze" means:',a:'Stopping all change activities',b:'Embedding the new state as the normal way of working so people don\'t revert',c:'Freezing the budget',d:'Pausing the project',answer:'b',explain:'Refreeze solidifies the new state as normal—through policies, training, incentives—preventing regression to old behaviours.'},
{topic:'change',q:'The ADKAR model works at which level?',a:'Organisational level only',b:'Individual level—each person\'s change journey',c:'Portfolio level',d:'Industry level',answer:'b',explain:'ADKAR addresses individual change: each person needs Awareness, Desire, Knowledge, Ability, and Reinforcement to change successfully.'},
{topic:'change',q:'The Change Curve describes the emotional journey as:',a:'Plan → Execute → Close',b:'Denial → Resistance → Exploration → Commitment',c:'Forming → Storming → Norming',d:'Assess → Design → Implement',answer:'b',explain:'The Change Curve shows the emotional transition: initial shock/denial, resistance, exploration of new ways, and eventual commitment.'},
{topic:'change',q:'Quick wins in change management are important because they:',a:'Save the most money',b:'Build momentum, demonstrate progress, and build credibility for the change',c:'Are the easiest tasks',d:'Allow the PM to claim early success',answer:'b',explain:'Quick wins create visible evidence that the change is working, building confidence and reducing resistance.'},
{topic:'change',q:'The single MOST important factor in successful organisational change is:',a:'Budget',b:'Technology',c:'Active senior leadership sponsorship and effective communication',d:'Detailed Gantt charts',answer:'c',explain:'Research consistently shows that sponsorship and communication are the top success factors in change management.'},

const saqQuestions = [
{topic:'governance',q:'Explain the purpose of project governance and describe the key roles within a governance structure.',bullets:['Governance provides framework for decision-making, oversight and accountability','Key roles: Sponsor (accountable for business case), PM (day-to-day delivery), Board (strategic direction)','RACI matrix clarifies responsibilities - only ONE Accountable per activity','Stage gates provide go/no-go decision points between phases','Governance must be proportionate to project complexity and risk'],example:'Project governance establishes authority, accountability and decision-making structures. A project board chaired by the sponsor meets monthly to review progress, approve changes above tolerance, and confirm ongoing business case viability. The PM manages within defined tolerances and escalates exceptions. RACI clarifies that while many people may be Responsible for tasks, only one person is Accountable for each decision. Stage gates between phases require formal sign-off before proceeding. In a £2M IT project, governance included a monthly board, weekly highlight reports within ±5% cost and ±2 week schedule tolerances.'},
{topic:'governance',q:'Describe the three types of PMO and explain when each is appropriate.',bullets:['Supportive PMO: advisory role providing templates, training, lessons learned. PM retains full authority','Controlling PMO: requires compliance with standards and methodologies. Moderate control','Directive PMO: directly manages projects. PMs report to PMO. Maximum control','Choice depends on organisational maturity, project complexity and need for consistency','PMO functions: resource management, reporting, methodology, portfolio prioritisation, lessons learned'],example:'A Supportive PMO suits mature organisations where experienced PMs need tools not direction—providing templates and coaching. A Controlling PMO suits organisations needing consistency across multiple projects—mandating standard reporting formats and methodology compliance. A Directive PMO suits large programmes or organisations with limited PM capability—the PMO assigns PMs and directly manages delivery. A manufacturing company moved from Supportive to Controlling PMO after inconsistent delivery across 40+ projects. Standard stage-gates, monthly reporting dashboards, and mandated risk reviews improved on-time delivery from 45% to 78%.'},
{topic:'power',q:'Explain French and Raven\'s sources of power and their relevance to project managers in matrix organisations.',bullets:['Legitimate (position authority), Reward (can give benefits), Coercive (can punish), Expert (knowledge), Referent (personal charisma), Informational (access to key information)','PMs in matrix organisations often lack legitimate power over team members','Expert and referent power become critical for PMs to influence without authority','Coercive power is least effective long-term - damages relationships','Building multiple power bases increases a PM\'s ability to deliver through others'],example:'In a matrix organisation, the PM had no line authority over team members who reported to functional managers. They built Expert power by demonstrating deep technical knowledge in design reviews, earning team respect. They built Referent power through consistent fairness, follow-through on promises, and genuine concern for team development. Informational power came from being the central communication hub. When a resource conflict arose, the PM influenced the functional manager through demonstrating project value (expert) and the relationship built over time (referent), rather than escalating through formal hierarchy (legitimate). Result: voluntary resource commitment without management intervention.'},
{topic:'power',q:'Describe the Power/Interest Grid and explain how it guides stakeholder engagement strategies.',bullets:['Maps stakeholders on two axes: Power (ability to influence) and Interest (level of concern)','High Power/High Interest: Manage Closely - regular engagement, involve in decisions','High Power/Low Interest: Keep Satisfied - periodic updates, don\'t overload','Low Power/High Interest: Keep Informed - regular communication, potential advocates','Low Power/Low Interest: Monitor - minimal effort, watch for changes','Positions change over time - requires regular reassessment'],example:'For a hospital IT project: the Clinical Director (high power/high interest) received weekly meetings and was involved in all clinical design decisions. The CFO (high power/low interest) received monthly financial summaries—enough to maintain satisfaction without consuming their time. Ward nurses (low power/high interest) received fortnightly newsletters and quarterly demonstrations—they could become resistors if poorly informed. The public (low power/low interest) was monitored via occasional press coverage. When a budget overrun occurred, the CFO moved to high interest, triggering immediate detailed financial engagement before dissatisfaction developed.'},
{topic:'culture',q:'Explain Schein\'s Three Levels of Culture and describe how a PM can work effectively within an organisational culture.',bullets:['Level 1 Artefacts: visible elements - office layout, dress code, meeting formats, language used','Level 2 Espoused Values: stated strategies, goals, philosophies - what the org says it values','Level 3 Basic Assumptions: unconscious, taken-for-granted beliefs - actual unwritten rules','The gap between Level 2 and 3 reveals cultural dysfunction - stated vs actual','PMs must work with the REAL culture (assumptions) not just the stated culture (values)'],example:'A PM joining a new organisation observed: open-plan office with collaborative spaces (artefact), company values poster stating "we empower our people" (espoused value), but every decision over £5k needed director sign-off and no one took initiative without explicit permission (basic assumption: control is needed). Rather than fighting this culture, the PM adapted—scheduling pre-meetings with directors to get informal approval, building decision documentation that made sign-off efficient, and framing requests in terms of risk mitigation (which resonated with the control-oriented assumptions). This was 10x more effective than demanding "empowerment" that the real culture didn\'t support.'},
{topic:'culture',q:'Describe Hofstede\'s Cultural Dimensions and explain how they affect managing international project teams.',bullets:['Power Distance: acceptance of unequal power - affects communication openness and escalation','Individualism/Collectivism: impacts team motivation, reward systems, decision-making','Uncertainty Avoidance: influences planning detail, risk tolerance, flexibility','Masculinity/Femininity: affects work-life balance expectations, competitive vs collaborative','Long-term/Short-term Orientation: impacts benefit timelines, investment decisions'],example:'Managing a global rollout across UK (low PD, individualist), Japan (high PD, collectivist), and Brazil (high PD, collectivist) required adaptive approaches. UK workshops used open debate with direct challenge expected. Japan required structured individual consultations before meetings—public disagreement was culturally inappropriate, so consensus was built offline. Brazil required relationship-building social events before business discussions. Reporting frequency varied: UK monthly (low uncertainty avoidance), Japan weekly (high uncertainty avoidance). Individual performance bonuses motivated the UK team but team rewards suited Japan and Brazil. The PM learned that one global approach fails—cultural adaptation is essential.'},
{topic:'relationships',q:'Explain how a project manager builds and maintains effective stakeholder relationships throughout a project.',bullets:['Invest time understanding individual motivations, concerns and communication preferences','Build trust through competence (delivering), consistency (predictable behaviour) and care (genuine interest in their success)','Use both formal (steering committees) and informal (coffee conversations) engagement','Tailor approach using Power/Interest analysis - different strategies for different stakeholders','Maintain relationships proactively - don\'t only engage when you need something or have problems'],example:'The PM scheduled monthly formal steering committees but also held informal monthly coffees with each board member, created a stakeholder map updated quarterly, and sent personalised updates addressing each person\'s specific concerns. When a significant delay occurred, the PM informed the sponsor within 2 hours rather than waiting for the board meeting—this transparency strengthened trust. The PM also facilitated introductions between stakeholders who could help each other, creating reciprocal goodwill. When budget approval was needed 6 months later, the strong relationship meant the sponsor advocated personally to the finance committee.'},
{topic:'leadership',q:'Compare Situational Leadership styles and explain when each is appropriate in a project context.',bullets:['S1 Directing: high task, low relationship - for new/inexperienced team members who need clear instructions','S2 Coaching: high task, high relationship - for developing people who need guidance AND encouragement','S3 Supporting: low task, high relationship - for capable people who need confidence/encouragement not direction','S4 Delegating: low task, low relationship - for experienced, self-motivated people who need autonomy','Key insight: no single style works for everyone - diagnose readiness and adapt'],example:'A PM leading a mixed team used: S1 Directing with a graduate analyst (daily briefings, specific tasks, close supervision). S2 Coaching with a junior developer struggling with complexity (pairing sessions, explaining rationale, encouragement alongside technical guidance). S3 Supporting with an experienced BA new to the sector (weekly check-ins, asking their opinions, providing sector contacts). S4 Delegating with a senior architect (monthly catch-ups, full autonomy on design decisions, only engaging when they requested input). As team members developed, styles evolved—the graduate moved to S2 Coaching after 3 months as competence grew.'},
{topic:'leadership',q:'Explain the difference between leadership and management, with examples of when each is needed in projects.',bullets:['Management: planning, organising, controlling - doing things RIGHT (efficiency, order, consistency)','Leadership: vision, inspiration, motivation, change - doing the RIGHT THINGS (effectiveness, direction)','Projects need BOTH: management for delivery discipline, leadership for engagement and navigation','Transactional (management): rewards compliance, manages by exception','Transformational (leadership): inspires beyond expectations, creates shared purpose'],example:'A PM delivering a hospital system demonstrated management by maintaining a 500-activity plan, tracking EVM weekly, running formal change control, and producing board reports on time. They demonstrated leadership by crafting a compelling vision ("zero patient data errors"), personally visiting wards to understand clinician frustrations, publicly recognising team contributions at sprint reviews, and coaching a struggling developer rather than replacing them. When stakeholder resistance threatened the project, it was leadership (influence, vision, relationship) that resolved it—not management (plans and controls). The project succeeded because management kept it on track while leadership kept people motivated.'},
{topic:'teamwork',q:'Describe Tuckman\'s team development model and explain the PM\'s role at each stage.',bullets:['Forming: uncertain, polite, dependent on leader - PM provides clear structure, purpose, roles','Storming: conflict, challenge authority, power struggles - PM facilitates resolution, maintains focus','Norming: cohesion, agreement on ways of working - PM steps back, encourages collaboration','Performing: autonomous, productive, self-managing - PM delegates, removes obstacles, celebrates','Adjourning: disbanding, transition - PM captures lessons, recognises contributions, manages emotions'],example:'A new cross-functional team: In Forming, the PM held a kick-off workshop establishing team charter, roles (RACI), and short-term objectives. During Storming, two senior developers clashed over architecture—the PM facilitated structured debate using decision criteria, helping consensus emerge while acknowledging both viewpoints. In Norming, the team organically developed daily stand-ups and code reviews—the PM reinforced these and stepped back from directing. At Performing, the team self-organised sprints and proactively managed dependencies—the PM focused on removing external blockers and managing stakeholders. When a key member left, the team briefly returned to Storming before re-norming with revised roles.'},
{topic:'teamwork',q:'Explain Belbin\'s Team Roles theory and why role diversity matters for project team effectiveness.',bullets:['9 roles in 3 categories: Action (Shaper, Implementer, Completer-Finisher), People (Coordinator, Teamworker, Resource Investigator), Thinking (Plant, Monitor-Evaluator, Specialist)','Each person has preferred roles, manageable roles, and least preferred roles','Balanced teams outperform groups of similar types','Role awareness helps allocate tasks and understand sources of tension','Allowable weaknesses: each role has associated weaknesses that should be tolerated'],example:'A PM used Belbin profiling when forming a team and discovered it was dominated by Shapers and Plants—high energy and creativity but poor follow-through and attention to detail. Adding a Completer-Finisher and Implementer improved delivery dramatically. The PM used role awareness to manage tension: recognising that conflict between the Shaper (pushing deadlines) and Monitor-Evaluator (wanting more analysis) was productive role tension, not personal conflict. By framing it as "we need both pace AND quality assurance," both felt valued. Work was allocated to strengths: Plants generated options, Monitor-Evaluators assessed them, Implementers created plans, Completer-Finishers ensured quality.'},
{topic:'conflict',q:'Explain the Thomas-Kilmann conflict handling modes and describe when each is appropriate.',bullets:['Competing (assertive/uncooperative): emergencies, safety issues, unpopular necessary decisions','Collaborating (assertive/cooperative): important issues where both parties\' needs must be met, time available','Compromising (moderate both): goals moderately important, time-pressured, temporary settlements','Avoiding (unassertive/uncooperative): trivial issues, emotions too high, no chance of winning','Accommodating (unassertive/cooperative): when you\'re wrong, relationship more important than issue, building goodwill'],example:'The PM used different modes situationally: COMPETING when insisting on halting construction due to safety concerns—non-negotiable despite schedule pressure. COLLABORATING when two departments both needed server capacity—explored needs and found a cloud solution better than either original request. COMPROMISING by splitting a contested budget 60/40 based on relative priority when time pressure prevented full collaboration. AVOIDING a heated design debate at 5pm, postponing to the next morning when people could think rationally. ACCOMMODATING by accepting a stakeholder\'s preferred reporting format even though it meant extra work—the relationship was more important. The key: conscious choice based on context, not defaulting to natural preference.'},
{topic:'conflict',q:'Describe how to manage a project crisis effectively, using a structured approach.',bullets:['Immediate: assess situation factually, stabilise, establish what is known vs unknown','Communicate: inform sponsor/key stakeholders immediately with facts and planned response','Decide: convene crisis team, make rapid decisions with imperfect information','Act: implement containment/recovery, assign clear ownership, set frequent review points','Recover: post-crisis review, capture lessons, update risk register, restore confidence'],example:'When a critical supplier went into administration mid-project: ASSESS—within 2 hours identified what was delivered, what remained, contractual position. COMMUNICATE—briefed sponsor within 1 hour, stakeholder update within 4 hours acknowledging issue and response plan. DECIDE—crisis team evaluated three options within 48 hours: alternative supplier (6 weeks onboard), in-house (risky), descope (unacceptable for compliance). ACT—split approach: critical path work in-house immediately while onboarding alternative supplier for remaining scope. Daily progress reporting. RECOVER—delivered 2 weeks late (within grace period), lessons learned identified earlier warning signs missed, updated risk register to include supplier financial monitoring.'},
{topic:'resourcefulness',q:'Explain De Bono\'s Six Thinking Hats and demonstrate how they enable creative problem-solving in projects.',bullets:['White Hat: focus on available data and facts - what do we know? What\'s missing?','Red Hat: feelings and intuition without justification - gut reactions','Black Hat: critical judgement - risks, dangers, problems (devil\'s advocate)','Yellow Hat: optimistic - benefits, value, opportunities','Green Hat: creative - alternatives, new ideas, lateral thinking','Blue Hat: process control - manages thinking, summarises, next steps'],example:'Facing a seemingly impossible 30% deadline reduction, the PM facilitated a Hats session. WHITE: established facts—current critical path, resources, dependencies, contractual constraints. RED: team expressed frustration but also excitement at the challenge. BLACK: identified risks of fast-tracking—quality issues, burnout, rework. YELLOW: explored benefits—first-to-market advantage, team growth, strengthened client relationship. GREEN: generated creative options—parallel prototyping, component reuse from previous project, automated testing to halve QA time, client co-location to eliminate approval delays. BLUE: PM summarised, prioritised by feasibility. Result: innovative approach achieved 90% of the reduction through automation and reuse—ideas that wouldn\'t have emerged in a normal "what do we cut?" discussion.'},
{topic:'resourcefulness',q:'How can Root Cause Analysis techniques be applied to prevent recurring project problems?',bullets:['5 Whys: repeatedly asking "Why?" (typically 5 levels) to drill from symptom to root cause','Ishikawa/Fishbone: categorises causes into groups (People, Process, Technology, Environment, Materials, Measurement)','Pareto Analysis (80/20): identifies the vital few causes responsible for most problems','Key principle: treating symptoms means problems recur; treating root causes provides lasting solutions','Should lead to preventive (process changes) not just corrective (fixing this instance) actions'],example:'Problem: client rejected deliverable. WHY? Requirements didn\'t match expectations. WHY? Requirements were ambiguous. WHY? Business analyst didn\'t validate with end users. WHY? No user access was arranged. WHY? Stakeholder identification didn\'t flag end users as key stakeholders. ROOT CAUSE: inadequate stakeholder identification process at initiation. FIX: enhanced stakeholder identification checklist added to initiation template (preventive, not just corrective). An Ishikawa diagram for quality failures categorised causes: People (insufficient training), Process (no peer review), Technology (outdated tools), Materials (supplier quality declining). Pareto showed 80% of defects came from just two causes—missing peer review and inadequate training. Addressing just these two reduced defect rate by 75%.'},
{topic:'time',q:'Explain the Critical Path Method and its importance for project scheduling and control.',bullets:['Critical Path = longest sequence of dependent activities = minimum project duration','Activities on critical path have ZERO float—any delay directly extends end date','Float = Late Start - Early Start (or Late Finish - Early Finish)','Forward pass calculates earliest dates; backward pass calculates latest dates','Management attention focuses on critical path activities; near-critical paths also monitored'],example:'Building project with two paths: Design(4w)→Foundation(6w)→Structure(8w)→Fit-out(4w) = 22 weeks, and Design(4w)→Procurement(3w)→Fit-out(4w) = 11 weeks. Critical path is 22 weeks through Foundation/Structure. Procurement has 11 weeks of float. The PM focused on critical activities—ensuring foundation contractors confirmed early, monitoring structure daily, contingency plans for weather delays. When the client requested 2-week reduction: crashing Structure (extra resources, reducing to 6 weeks at £50k) was selected over fast-tracking (starting Structure before Foundation complete—physically impossible). Understanding CPM enabled informed trade-off: cost vs time with quantified impact.'},
{topic:'time',q:'Compare crashing and fast-tracking as schedule compression techniques.',bullets:['Crashing: adding resources to critical path activities to reduce duration. INCREASES COST','Fast-tracking: performing sequential activities in parallel. INCREASES RISK','Crashing only works where added resources can actually reduce duration (not all tasks are "crashable")','Fast-tracking only possible where dependencies are discretionary, not mandatory','Both techniques ONLY help on critical path activities—compressing non-critical work does nothing'],example:'Software project 6 weeks late. CRASHING: adding 2 developers to 12-week dev phase could reduce to 9 weeks at £45k extra plus 2 weeks onboarding (net: 1 week saved for £45k—poor value). Adding second test environment could reduce 8-week test to 5 weeks for £20k (3 weeks saved—good value). FAST-TRACKING: starting UAT while system testing completes final module (normally sequential) saves 2 weeks but risks late integration defects. Starting training development parallel to final coding saves 3 weeks with moderate risk of rework. SELECTED: crash testing environment (3 weeks, £20k, low risk) + fast-track training (3 weeks, moderate risk with versioned drafts as mitigation). 6 weeks recovered within acceptable cost/risk.'},
{topic:'organisation',q:'Explain the purpose and benefits of Configuration Management in projects.',bullets:['Identifies, tracks and controls versions of project deliverables and documents','Ensures everyone works from the correct, approved version (the "single source of truth")','Provides audit trail: what changed, when, by whom, and why','Prevents unauthorised changes to baselined deliverables','Four processes: Identification, Control, Status Accounting, Verification/Audit'],example:'In a software project, CM covered: source code (Git with branching strategy), documents (SharePoint with mandatory check-in/check-out and version numbering), infrastructure configs (as code, version-controlled), and test environments (documented builds). When a production defect occurred, CM enabled tracing exactly which code version was deployed, which change introduced the defect, which test environment was used, and why the defect wasn\'t caught (test env was v2.3, production was v2.4—mismatch identified in minutes, not days). Without CM, diagnosis would have taken weeks. The process: Identification (register of controlled items), Control (approval before baseline changes), Status Accounting (dashboard of current versions), Verification (periodic audits confirming actual matches records).'},
{topic:'quality',q:'Distinguish between Quality Assurance and Quality Control with practical project examples.',bullets:['QA is PROCESS-focused and PREVENTIVE: are we following the right processes to build quality in?','QC is PRODUCT-focused and DETECTIVE: does the deliverable meet defined standards?','QA activities: process audits, methodology reviews, peer review of approach, training','QC activities: testing, inspections, measurements against acceptance criteria','Investing in QA (prevention) reduces QC failures and total cost of quality'],example:'Construction project: QA activities included auditing that approved methodology was followed, verifying qualified personnel performed specialist tasks, checking calibrated equipment used, and confirming material certificates obtained BEFORE work started. QC activities included physical inspection of steelwork against drawings, concrete strength testing at 7 and 28 days, dimensional surveys against tolerances, and client witness inspections. When QA audit revealed subcontractor method statements weren\'t being reviewed before work commenced (QA failure), this was corrected immediately—preventing expensive rework that would only be discovered at inspection (QC failure). Prevention costs (training, QA audits) were 8% of budget; failure costs before QA improvement were 22%.'},
{topic:'finance',q:'Explain Earned Value Management and demonstrate how it integrates scope, time and cost measurement.',bullets:['PV (Planned Value): budgeted cost of work SCHEDULED by this point','EV (Earned Value): budgeted cost of work actually PERFORMED/completed','AC (Actual Cost): actual money spent on work performed','SV = EV-PV (schedule); CV = EV-AC (cost); SPI = EV/PV; CPI = EV/AC','EAC = BAC/CPI (forecast final cost if current efficiency continues)'],example:'Project building 10 modules at £10k each (BAC=£100k), 1 per week planned. At week 6: PV=£60k (6 should be done), EV=£50k (5 actually complete), AC=£55k (spent £55k). SV=£50k-£60k=-£10k (behind schedule). CV=£50k-£55k=-£5k (over budget). SPI=50/60=0.83 (achieving 83% of planned progress). CPI=50/55=0.91 (getting 91p value per £1 spent). EAC=£100k/0.91=£110k (forecast £10k over budget). Presented to sponsor: "We are behind AND over budget. Root cause: design complexity taking longer, overtime driving up costs." Corrective actions: simplify remaining designs, add one contractor for targeted sprint rather than continued overtime.'},
{topic:'finance',q:'Compare cost estimating techniques and explain when each is most appropriate.',bullets:['Analogous (top-down): uses similar past projects. Quick, less accurate (±40%). Good early when detail lacking','Parametric: statistical relationships (cost per m²). Accurate if good historical data (±25%)','Bottom-up: estimates each work package then aggregates. Most accurate (±10%) but time-consuming, needs WBS','Three-point (PERT): (O+4M+P)/6 accounts for uncertainty. Shows range not just single number','Accuracy improves as project progresses: Cone of Uncertainty narrows from -25%/+75% to ±5%'],example:'Construction company approach: At CONCEPT: Analogous—"last similar office was £2,500/sqm, so 5,000sqm ≈ £12.5M." Accuracy ±40%, took 2 hours. At FEASIBILITY: Parametric—regression analysis of 50 previous builds adjusted for location/specification gave £14.2M ±25%, took 2 days. At DETAILED DESIGN: Bottom-up—each WBS package priced (foundations £800k, steelwork £1.2M, etc.) giving £15.1M ±10%, took 3 weeks. Three-point for uncertain elements: groundworks Optimistic £600k, Most Likely £800k, Pessimistic £1.4M = PERT £867k. Added 10% contingency (known unknowns) + 5% management reserve (unknown unknowns). Total approved budget: £17.4M.'},
{topic:'resources',q:'Explain resource levelling and smoothing, and when each technique should be used.',bullets:['Levelling: resolves over-allocation by delaying activities—MAY EXTEND project end date','Smoothing: redistributes work within available float—MAINTAINS project end date','Levelling when: resource constraints are priority (limited specialists, fixed team size)','Smoothing when: end date is priority but want to reduce resource peaks','Both use float on non-critical activities; only levelling may delay critical activities'],example:'Software project: two key developers allocated 150% capacity weeks 4-6. LEVELLING: delayed lower-priority activity to weeks 7-9 when developer free. Result: conflict resolved but project extended 3 weeks (delayed activity was near-critical). Acceptable because hiring contractors (£30k + knowledge risk) was worse. SMOOTHING: different over-allocation—tester at 120% in week 8 but with activities having float. Starting one test activity 2 days earlier (using 5 days available float) reduced peak to 100% without affecting end date. Decision logic: if contractual end date has penalties, smooth (accept minor over-allocation or fund overtime). If resources genuinely unavailable, level—then communicate schedule impact to sponsor for decision.'},
{topic:'stakeholders',q:'Describe a comprehensive stakeholder management process and explain why continuous reassessment is important.',bullets:['IDENTIFY: multiple techniques (brainstorming, org charts, categories) to find ALL stakeholders','ANALYSE: assess power, interest, attitude—understand what matters to each person','PLAN: develop tailored engagement strategy per stakeholder or group','ENGAGE: execute through appropriate communication, involvement, relationship building','MONITOR: regularly reassess—attitudes change over time, requiring strategy adjustment'],example:'City centre redevelopment: IDENTIFY used multiple lenses—organisational (council, developers), community (residents, businesses, schools), regulatory (planning authority, environment agency), interest groups (heritage society, disability groups). 47 groups identified. ANALYSE: Power/Interest mapping plus individual interviews understanding specific concerns. PLAN: planning authority (high power/interest) got weekly updates; local businesses (low power/high interest) got monthly newsletters; heritage society (medium power/high interest) joined design advisory panel. ENGAGE: dedicated community liaison, project website, quarterly public exhibitions. MONITOR: monthly stakeholder map review. When residents\' group shifted from Neutral to Resistant after noise complaints, immediate action—revised working hours, acoustic barriers, personal visits from site manager—moved them back to Neutral within 6 weeks.'},
];
