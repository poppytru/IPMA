const podcastData = {
'strategy':{title:'Strategy',duration:'4:30',script:'Right, so let\'s talk strategy. The big idea here is that your project doesn\'t exist in a vacuum — it exists to serve the organisation\'s strategic goals. If you deliver a technically perfect project on time and budget, but it doesn\'t contribute to what the business actually needs... that\'s not success in IPMA\'s eyes. Think about Kodak — they literally invented digital photography, but their projects were all focused on film. Strategically misaligned work that led to bankruptcy. The models you need to know: PESTLE scans the external world — political changes, economic conditions, social trends, technology shifts, legal requirements, environmental pressures. SWOT looks inward and outward — strengths, weaknesses, opportunities, threats. The Balanced Scorecard measures performance across four lenses: financial, customer, internal process, and learning. And the Ansoff Matrix helps choose growth direction. The key concept? Strategy cascades: Vision, then Mission, then Strategy, then Portfolio, Programme, and finally Project. Your business case is the golden thread connecting your project back up to strategy. And benefits realisation? That\'s making sure the good stuff actually happens AFTER you deliver.'},
'compliance':{title:'Compliance, Standards & Regulations',duration:'3:45',script:'Compliance. Not the most exciting topic, but get this wrong and you could face legal action, so pay attention. The golden rule: if your project objective conflicts with the law, the law wins. Every. Single. Time. No schedule pressure, no budget constraint justifies breaking regulations. Think of standards in two buckets. Mandatory ones are regulations — GDPR for data, health and safety law, environmental regulations. You MUST comply. Then there are voluntary standards — ISO 21500 for project management guidance, ISO 31000 for risk, PRINCE2, our own ICB4. These represent best practice but aren\'t legally binding. Professional ethics matters too: transparency means being honest about project status even when it\'s bad news. Responsibility means owning your decisions. Confidentiality means protecting sensitive information. Think of Grenfell — that\'s what happens when compliance becomes optional. Your duty of care as a PM is a legal obligation. You cannot delegate it away by saying "oh, that\'s the safety officer\'s job." It\'s YOUR job too.'},
'self-reflection':{title:'Self-Reflection & Self-Management',duration:'4:00',script:'Self-reflection is about knowing yourself well enough to lead others effectively. You can\'t manage a team if you can\'t manage yourself. The Johari Window is a brilliant model here — picture a two-by-two grid. The "Open" area is stuff everyone knows about you. The "Blind Spot" is what others see but you don\'t. The "Hidden" area is what you keep private. And "Unknown" is undiscovered potential. Three-sixty feedback is gold for shrinking that blind spot. Imagine discovering that your team finds you unapproachable — you had no idea, but it\'s been killing collaboration for months. That\'s a blind spot. Kolb\'s Learning Cycle reminds us that experience alone isn\'t enough. You have to reflect on it, form a theory about it, and then test that theory. That\'s how you actually grow. Goleman\'s Emotional Intelligence: five bits — self-awareness comes first, then self-regulation, motivation, empathy, and social skills. You build from the inside out. And the Eisenhower Matrix? Urgent plus important means do it now. Important but not urgent? Schedule it. That\'s where your strategic thinking lives.'},
'integrity':{title:'Personal Integrity & Reliability',duration:'3:30',script:'Trust. It\'s your most valuable asset as a project manager, and here\'s the formula for it: the Trust Equation. Trust equals Credibility plus Reliability plus Intimacy, all divided by Self-Orientation. So the more self-focused you are, the LESS people trust you. Lower that denominator. Reliability is doing what you say you\'ll do. Every time. Not most of the time — every time. It\'s built slowly through hundreds of kept promises and destroyed instantly by one broken one. Here\'s a real scenario that sticks: a PM always gave honest status reports — including the bad news. When they later asked for emergency budget, the board approved it immediately. Why? Because their track record of transparency meant the board believed the request was genuine. Compare that to the PM who always said "everything\'s fine" then suddenly needed two hundred grand — no trust, no budget, project failed. Accountability means owning outcomes. When things go well, share credit with the team. When things go wrong, stand up and own it. That builds referent power faster than anything.'},
'communication':{title:'Personal Communication',duration:'4:15',script:'Here\'s a stat that might surprise you: project managers spend roughly seventy percent of their time communicating. Not planning, not controlling — communicating. So getting this right is... kind of important. Mehrabian found that for emotional messages, only seven percent of meaning comes from words. Thirty-eight percent is tone of voice, and fifty-five percent is body language. Now, careful — this applies to emotional or attitudinal messages, not all communication. But it does mean your email saying "the project is fine" doesn\'t carry much weight if your face in the meeting says otherwise. The Shannon-Weaver model shows how messages get distorted by "noise" — that can be physical noise, psychological distractions, or semantic confusion where words mean different things to different people. Active listening is about being fully present — paraphrasing back, asking clarifying questions, not just waiting for your turn to talk. And communication channels matter. Push communication goes TO people — emails, reports. Pull makes information AVAILABLE — dashboards, wikis. Important stuff needs redundancy — don\'t just send one email about a critical risk and assume it\'s handled.'},
'negotiation':{title:'Negotiation',duration:'3:45',script:'The Harvard Principled Negotiation approach. Four pillars, commit these to memory: separate people from the problem. Focus on interests, not positions. Invent options for mutual gain. Use objective criteria. Here\'s why interests matter more than positions. Two project teams fighting over the same developer — that\'s their position: "I want this person." But what are their interests? One needs architecture design in weeks one to three. The other needs coding in weeks four to eight. Sequential sharing satisfies both interests perfectly — zero compromise needed. That only emerges when you dig beneath positions. BATNA — Best Alternative To a Negotiated Agreement. This is your power source. If you have a strong fallback, you negotiate from strength. If your BATNA is terrible, you\'re desperate and the other party knows it. Always know your BATNA before entering any negotiation. And preparation is everything — research suggests eighty percent of negotiation success is determined before anyone sits down at the table. Know your interests, their interests, your BATNA, their likely BATNA, and possible creative options.'},
'results':{title:'Results Orientation',duration:'3:30',script:'Results orientation is about cutting through activity to focus on what actually matters: outcomes. The distinction is critical. An output is what you deliver — a shiny new system. An outcome is the change that results — staff work more efficiently. A benefit is the measured improvement — thirty percent cost reduction. You can deliver perfect outputs and achieve zero benefits if nobody adopts the change. SMART objectives are your foundation: Specific, Measurable, Achievable, Relevant, Time-bound. "Make the system faster" is not SMART. "Reduce page load time to under two seconds for ninety-five percent of requests by March" — that\'s SMART. MoSCoW helps prioritise: Must have, Should have, Could have, Won\'t have this time. And the PDCA cycle drives continuous improvement: Plan what you\'ll do, Do it, Check the results against expectations, Act on what you learned. Don\'t just plan once — iterate. A memorable example: a team delivered a perfect CRM system but nobody used it because change management was neglected. Perfect output, zero outcome, zero benefit. Technical delivery without adoption equals failure.'},
'design':{title:'Project Design',duration:'3:30',script:'Project design is where strategy meets reality. Your business case is the key document — it justifies why this project should exist. It should contain: strategic fit, options appraisal, expected benefits, estimated costs, key risks, and timescales. And it\'s a LIVING document — reviewed at every gate to check the project still makes sense. Methodology choice matters: Waterfall works when requirements are stable and well-understood. Agile suits evolving requirements with stakeholders wanting early value. Hybrid combines both — maybe Waterfall for infrastructure, Agile for software on the same programme. Gate reviews are your governance checkpoints — formal decisions to continue, modify, or stop. They prevent zombie projects stumbling on when the business case is dead. A good example: a company chose Waterfall for a regulatory system with fixed requirements and Agile for the customer app with evolving needs. Same programme, different methodologies matching context. That\'s smart project design.'},
'risk':{title:'Risk & Opportunity',duration:'4:00',script:'Risk is uncertainty that matters. And here\'s what most people miss — it can be POSITIVE. An opportunity is a positive risk. The process: Identify, Assess (probability times impact), Plan Responses, Monitor. For threats, your four responses are: Avoid (eliminate the threat entirely), Transfer (pass it to someone else — insurance, contracts), Mitigate (reduce probability or impact), Accept (acknowledge it and carry on). For opportunities: Exploit (make certain it happens), Share (partner with someone), Enhance (increase its probability or impact), Accept (welcome it if it occurs). Key concepts to remember: risk appetite is how much risk the organisation will tolerate. Residual risk is what remains AFTER you\'ve implemented responses — you still need to monitor it. And secondary risks are new risks CREATED by your response — like outsourcing development (transfers cost risk) but creating knowledge dependency on the supplier. Here\'s a memorable scenario: a response to transfer cost risk via fixed-price contract created a secondary risk of supplier cutting corners on quality. The response itself needed managing — risk of the response!'},
'change':{title:'Change & Transformation',duration:'4:15',script:'Change management is about people. Full stop. You can have the best system, the best process, the best technology — if people don\'t adopt it, you\'ve achieved nothing. Kotter gives you eight steps: start with URGENCY — people must feel why change is needed NOW. Build a COALITION of influential supporters. Create a clear VISION of the future state. COMMUNICATE it relentlessly. EMPOWER people to act by removing barriers. Generate QUICK WINS that prove it\'s working. CONSOLIDATE gains — don\'t declare victory too early. And ANCHOR the change in organisational culture so it sticks. Lewin is simpler: Unfreeze the current state (create dissatisfaction), make the Change (transition), Refreeze (embed as new normal). ADKAR works at individual level: does this person have Awareness of WHY, Desire to participate, Knowledge of HOW, Ability to do it, and Reinforcement to sustain it? A memorable failure: a brilliant new system was implemented but nobody told staff WHY it was needed. No Awareness in ADKAR means no Desire to change — system sat unused for six months until a proper change programme was run alongside it.'},
'governance':{title:'Governance, Structures & Processes',duration:'3:45',script:'Governance answers three questions: who makes decisions, how are they made, and how is performance overseen? Your project board or steering committee provides strategic direction. The sponsor is the single accountable person — they own the business case, secure funding, and champion the project. The PM delivers day-to-day. RACI is your friend here: Responsible does the work, Accountable approves it — and critically, only ONE person should be Accountable for each task. Consulted provides input before, Informed is told after. Stage gates are formal checkpoints between phases where the board decides: continue, modify, or stop. A memorable disaster: a project without clear governance had three different directors each believing THEY were the decision-maker. Conflicting instructions caused six weeks of expensive rework before someone finally established a RACI and said "one voice, one direction." Define governance BEFORE you need it, not during the first crisis.'},
'power':{title:'Power & Interest',duration:'3:45',script:'Power in organisations is far more complex than the org chart suggests. French and Raven identified six sources: Legitimate power comes from your title. Reward power from what you can give people. Coercive from what you can threaten. Expert from your knowledge. Referent from your personal charisma and integrity. And Informational from what you know that others don\'t. Here\'s the thing for project managers: in matrix organisations, you typically DON\'T have legitimate power over your team. They report to functional managers, not you. So expert and referent power become your currency. Build expertise that people value. Build a reputation for fairness and follow-through that makes people WANT to support your project. Mendelow\'s Power/Interest grid maps stakeholders into four quadrants. High power, high interest? Manage them closely — these are your key players. High power, low interest? Keep them satisfied — a monthly summary is fine, but ignore them at your peril because they can become blockers overnight. The grid isn\'t static — people move between quadrants as circumstances change.'},
'culture':{title:'Culture & Values',duration:'3:45',script:'Culture is "how we do things around here." Schein says it operates at three levels. Level one: artefacts — what you can SEE. Open-plan offices, casual dress, daily stand-ups, how meetings run. Level two: espoused values — what they SAY. The company values poster, the mission statement, the CEO\'s speeches about innovation. Level three: basic assumptions — what they actually BELIEVE. The unconscious, unwritten rules that really drive behaviour. The gap between level two and three is where trouble hides. A company says "we empower our teams" but every decision needs three signatures. That gap will frustrate you unless you recognise it. Hofstede gives us national culture dimensions. Power Distance affects whether junior team members will challenge a PM\'s decision openly or silently comply. Uncertainty Avoidance influences whether teams demand detailed plans or embrace ambiguity. A PM managing teams across UK, Japan, and Brazil needed completely different approaches to communication, decision-making, and meeting structure. One size does not fit all.'},
'relationships':{title:'Relationships & Engagement',duration:'3:30',script:'Relationships are built on three pillars of trust: Competence — can you actually deliver? Consistency — are you predictable and reliable? Care — do you genuinely have my interests at heart? Miss any one and trust crumbles. The Engagement Assessment Matrix tracks where each stakeholder IS versus where you NEED them to be: Unaware, Resistant, Neutral, Supportive, or Leading. The gap between current and desired tells you how much work is needed. Here\'s a story that sticks: a PM inherited a project with a resistant finance director who was actively undermining progress. Rather than avoiding them, the PM scheduled monthly coffees, genuinely asked about their concerns, incorporated feedback into budget reporting format, and delivered early financial forecasts addressing their specific worries. Within three months, that resistant FD became the project\'s strongest advocate. The relationship investment paid compound returns when budget approval was needed later. The lesson: invest in relationships BEFORE you need them, not when you\'re desperate for support.'},
'leadership':{title:'Leadership',duration:'4:00',script:'Leadership and management are complementary but different. Management does things RIGHT — efficiency, planning, control, consistency. Leadership does the RIGHT THINGS — effectiveness, vision, inspiration, change. Projects need both. Situational Leadership from Hersey and Blanchard says there\'s no single best style — you adapt to follower readiness. Direct new people who are enthusiastic but unskilled. Coach developing people who have some skill but are frustrated. Support capable people who lack confidence. Delegate to experienced self-starters. A PM who uses the same style with everyone will over-manage experts (killing their motivation) and under-support novices (leaving them drowning). Adair\'s three circles remind us to balance Task, Team, and Individual needs. Too much task focus burns people out. Too much team focus without task delivery means nothing ships. Too much individual focus at the expense of the team creates dysfunction. The sweet spot is in the overlap. A transformational leader creates shared purpose that makes people WANT to go beyond expectations. A transactional leader ensures compliance through rewards and consequences. Both have their place.'},
'teamwork':{title:'Teamwork',duration:'3:45',script:'Tuckman is your anchor model here. Forming — the team comes together, everyone\'s polite and uncertain, looking to the leader for direction. Storming — conflict emerges, people challenge authority, power struggles happen. This is NORMAL and necessary — teams that skip storming often have artificial harmony and never achieve real performance. Norming — the team agrees ways of working, cohesion builds, people find their groove. Performing — autonomous, productive, self-managing. This is the goal. Adjourning — the project ends and people move on. Your role changes at each stage: directive in forming, facilitative in storming, supportive in norming, delegating in performing. Belbin shows that role diversity matters. Nine roles across three categories: Action people who drive delivery, People people who build harmony, and Thinking people who provide ideas and analysis. A team of all creative types will brainstorm brilliantly but never ship anything. A team of all implementers will execute efficiently but miss innovative solutions. Balance is key. And Lencioni\'s pyramid: without trust there\'s no honest conflict, without honest conflict there\'s no genuine commitment, without commitment there\'s no accountability, without accountability there\'s no attention to results.'},
'conflict':{title:'Conflict & Crisis',duration:'3:30',script:'Not all conflict is bad. Let me say that again — constructive disagreement makes decisions better. Two experienced professionals arguing about the best approach, with evidence and respect? That\'s gold. It\'s destructive personal conflict that damages projects. Thomas-Kilmann gives five modes. Competing: I win, you lose. Use for emergencies and safety. Collaborating: we both win. Use when time allows and both needs matter. Compromising: we both give something up. Use for moderate-importance time-pressured situations. Avoiding: nobody deals with it. Use when trivial or emotions are too high. Accommodating: I let you win. Use when you\'re wrong or relationship matters more than the issue. The key insight: consciously choose your mode based on the situation. Most people default to their natural preference regardless of context. Effective PMs flex deliberately. For crisis management: Assess the facts. Communicate immediately and transparently. Decide rapidly with imperfect information. Act decisively. Review and learn afterwards. Speed matters in crisis — delayed response allows problems to compound.'},
'resourcefulness':{title:'Resourcefulness',duration:'3:30',script:'Resourcefulness is creativity under constraints. It\'s easy to solve problems with unlimited budget and time. The skill is finding solutions when both are tight. De Bono\'s Six Thinking Hats force structured creativity by making everyone think in the same mode simultaneously. White hat: just facts. Red hat: gut feelings without justification. Black hat: risks and problems. Yellow hat: benefits and opportunities. Green hat: creative alternatives. Blue hat: manages the process. This prevents dominant personalities from controlling the discussion and ensures all perspectives get airtime. Root Cause Analysis using Five Whys is deceptively powerful. Problem: deliverable rejected. Why? Requirements wrong. Why? Not validated with users. Why? No user access. Why? Users not identified as stakeholders. Why? Inadequate identification process. ROOT CAUSE found. Fix the process, not just this instance. Design Thinking brings user empathy: Empathise with users, Define the real problem, Ideate solutions, Prototype quickly, Test and learn. A team facing a thirty percent budget cut used Green Hat thinking and found three deliverables could use open-source components, two could be university research partnerships. Full scope delivered at seventy percent of original cost. That\'s resourcefulness.'},
'time':{title:'Time',duration:'3:45',script:'Critical Path Method. Fundamental. It\'s the longest path through your network diagram, and it determines the minimum possible duration of your project. Activities on it have zero float — zero slack. Any delay to a critical activity delays the entire project. PERT uses three estimates: optimistic, most likely, and pessimistic. The formula is O plus four M plus P, all divided by six. This gives you an expected duration that accounts for uncertainty rather than a single-point guess. Compression techniques: Crashing adds resources to reduce critical path duration. It costs more money — overtime, extra staff, additional equipment. Fast-tracking runs activities in parallel that would normally be sequential. It increases risk because you might need to redo work if the parallel activity\'s output changes. Crucial point: both techniques ONLY work on the critical path. Compressing a non-critical activity with float doesn\'t help your end date one bit. And watch near-critical paths — they can become critical if a risk event consumes their limited float. A 20-week critical path and a 19-week near-critical path means you effectively have TWO paths to monitor.'},
'organisation':{title:'Organisation & Information',duration:'3:15',script:'Clear organisation structure prevents the classic project disaster: "I thought YOU were doing that." RACI makes it explicit — who\'s Responsible for doing the work, who\'s Accountable for the outcome, who gets Consulted for input, who gets Informed of results. One rule: only ONE A per row. Multiple accountabilities means nobody is accountable. Configuration Management ensures everyone uses the right version of everything. Without it, you get the horror story: a team spent three days building a component that already existed on a sister project. A fifteen-thousand-pound duplication nobody knew about until code review. A simple shared library would have prevented it. Your PMIS — Project Management Information System — is the toolset that makes information management practical: scheduling tools, document management, dashboards, collaboration platforms. The key success factor? It must be maintained and actually used. A brilliant system nobody updates is worse than a simple spreadsheet someone owns.'},
'quality':{title:'Quality',duration:'3:30',script:'Quality has two meanings: conformance to requirements AND fitness for purpose. Both matter. You can meet every written specification perfectly but if the product doesn\'t actually work for users in practice, quality has failed. Quality Assurance asks: are we following the right processes? It\'s preventive — process audits, methodology reviews, training. Quality Control asks: does the product meet standards? It\'s detective — testing, inspection, measurement. The Cost of Quality model is powerful. Prevention costs — training, planning, good tools — typically five to ten percent of budget. Appraisal costs — testing and reviews — ten to fifteen percent. Internal failure — rework before delivery — fifteen to twenty-five percent. External failure — warranty claims, reputation damage — twenty-five percent and UP. The maths is clear: spending more on prevention REDUCES total cost because failure costs are exponentially higher. A team that skipped code reviews to "save time" saw defect rates triple. Testing took forty percent longer. Two production incidents cost two hundred thousand pounds. The ten-thousand-pound "saving" on prevention cost twenty times more in failures. Prevention is always cheaper than cure.'},
'finance':{title:'Finance',duration:'4:00',script:'EVM — Earned Value Management. It\'s the exam\'s favourite topic and honestly it\'s elegant once you get it. Three numbers tell the whole story. PV — Planned Value — what you PLANNED to spend by now. EV — Earned Value — the value of work actually COMPLETED. AC — Actual Cost — what you actually SPENT. From these three: Schedule Variance equals EV minus PV. If it\'s negative, you\'re behind. Cost Variance equals EV minus AC. If it\'s negative, you\'re over budget. SPI — Schedule Performance Index — is EV divided by PV. Below one means behind schedule. CPI — Cost Performance Index — is EV divided by AC. Below one means over budget. And EAC — Estimate At Completion — is BAC divided by CPI, which forecasts your final cost. Quick example: month six of a twelve-month project. PV is six hundred K, EV is five hundred K, AC is five hundred and fifty K. SPI is nought-point-eight-three — only getting eighty-three percent of planned progress. CPI is nought-point-nine-one — getting ninety-one pence for every pound spent. EAC forecasts finishing at one-point-one million against a one million budget. Data-driven conversation with the board: here\'s where we are, here are options. That\'s financial management.'},
'resources':{title:'Resources',duration:'3:15',script:'Resource management in matrix organisations is fundamentally about negotiation and influence — because you typically don\'t have direct authority over team members. They report to functional managers who have their own priorities. Resource Levelling resolves over-allocation by delaying activities. It fixes the resource conflict but may extend your end date. Resource Smoothing uses available float to reduce peaks — it keeps your end date but only works when activities have float to use. A specialist allocated to three projects at forty percent each — that\'s one hundred and twenty percent total. Rather than fighting other PMs for priority, propose sequencing: one hundred percent for two critical weeks on each project in turn. All three PMs get what they need by coordinating rather than competing. That requires relationship and negotiation skills. Skills matrices identify capability gaps early — do you need to train, recruit, or buy in expertise? And over-allocation isn\'t just a scheduling problem — it leads to burnout, context-switching overhead, and quality issues. Protecting your team\'s capacity is protecting your project\'s quality.'},
'stakeholders':{title:'Stakeholders',duration:'3:30',script:'Stakeholders can make or break your project. The process: Identify — use multiple lenses. Don\'t just look at the org chart. Think about who\'s impacted, who has authority, who controls resources, who has relevant knowledge. A PM once identified the CEO\'s personal assistant as a key stakeholder — nobody else had thought of this. The PA controlled diary access and meeting priorities. By keeping her informed and building rapport, the PM got faster sponsor decisions than anyone else. Analyse using Power/Interest grid, Salience model, or simple interviews. Plan tailored engagement strategies — one size doesn\'t fit all. Engage through a mix of formal and informal channels. And Monitor — because attitudes change. The stakeholder who was supportive last month may become resistant after hearing about budget overruns this month. The engagement matrix tracks current versus desired states and tells you where to focus effort. Negative stakeholders deserve special attention: understand their resistance root cause before choosing your approach. Are they afraid of losing something? Address that fear directly. Are they uninformed? Communicate more. Are they ideologically opposed? You may need senior authority.'}
};

// ===== EXAM TIPS =====
const examTips = {
mcq:[
{title:'Time Management',tip:'60 questions in 60 minutes = 1 minute per question. If stuck after 30 seconds, mark it and move on. Return to marked questions at the end.'},
{title:'Elimination Strategy',tip:'Eliminate obviously wrong answers first. Usually 2 are clearly wrong, leaving a 50/50 choice. Words like "always" or "never" are often wrong in IPMA context.'},
{title:'Read the WHOLE Question',tip:'Read every word. "All EXCEPT", "which is NOT", "MOST appropriate" — missing these qualifiers costs easy marks.'},
{title:'IPMA Mindset',tip:'Think "what would IPMA recommend?" They favour collaborative, people-centred, stakeholder-engaged approaches over command-and-control.'},
{title:'Best Answer, Not Correct',tip:'Multiple options may be partially true. Choose the MOST correct answer. "Review and escalate" usually beats "decide alone."'},
{title:'Know Your Models',tip:'Know which model has which components. Is it Kotter (8 steps) or Lewin (3 phases)? Is it Tuckman (teams) or Thomas-Kilmann (conflict)?'},
{title:'Don\'t Overthink',tip:'First instinct is usually right. Don\'t change answers unless you\'re certain. Overthinking leads to selecting more complex (wrong) options.'},
{title:'No Negative Marking',tip:'Answer EVERY question. Never leave one blank. A guess has 25% chance; a blank has 0%.'}
],
saq:[
{title:'Structure Wins Marks',tip:'Use clear structure: Define the concept → Explain key elements → Apply to a scenario → Give an example → Link to project success. 5 strong points beat 2 pages of waffle.'},
{title:'Time Discipline',tip:'120 minutes for 12 questions = 10 min each. Spend 1 min reading, 8 min writing, 1 min reviewing. Move on even if not finished — partial answers on all 12 beats perfect answers on 8.'},
{title:'Choose Your 12 Wisely',tip:'Read ALL 14 questions first (spend 5 minutes). Choose the 12 you\'re most confident about. Don\'t attempt weak topics when stronger alternatives exist.'},
{title:'Name-Drop Models',tip:'"Using Tuckman\'s model (Forming, Storming, Norming, Performing)..." shows theoretical knowledge applied practically. Examiners look for this.'},
{title:'Always Give Examples',tip:'Every answer benefits from a brief practical example. It doesn\'t have to be real — a plausible "for example" shows application beyond textbook recall.'},
{title:'5 Marks Breakdown',tip:'Typically: 1 mark for definition/concept, 1 for key elements/model, 1 for application/how, 1 for example, 1 for depth/critical analysis.'},
{title:'Answer What\'s Asked',tip:'"Explain" = define and describe. "Compare" = similarities AND differences. "Evaluate" = pros, cons and judgement. Match your answer format to the question verb.'},
{title:'Link to PM Success',tip:'Always connect back to project management: "This approach helps deliver projects because..." Generic management theory without PM application loses marks.'}
]};

// ===== APP STATE =====
let currentSection = 'notes';
let currentExam = 'mcq';
let ragRatings = JSON.parse(localStorage.getItem('ipma-rag-v2') || '{}');
let selectedTopic = null;
let timerInterval = null;
let timerSeconds = 3600;
let timerRunning = false;
let speechUtterance = null;
let speechRate = 1.0;

// ===== UTILITY FUNCTIONS =====
function saveRag() { localStorage.setItem('ipma-rag-v2', JSON.stringify(ragRatings)); }
function getTopics() { return currentExam === 'mcq' ? mcqTopics : saqTopics; }
function getAllTopicIds() { let ids=[]; Object.values(getTopics()).forEach(c=>c.forEach(t=>ids.push(t.id))); return ids; }
function countByTopic(data, topicId) { return data.filter(d=>d.topic===topicId).length; }
function getRagStats(prefix, topicId) {
    let r=0,a=0,g=0;
    Object.entries(ragRatings).forEach(([k,v])=>{
        if(k.startsWith(prefix) && (!topicId || k.includes('-'+topicId+'-'))) {
            if(v==='red')r++; else if(v==='amber')a++; else if(v==='green')g++;
        }
    });
    return {red:r,amber:a,green:g,total:r+a+g};
}

function showSection(section) {
    currentSection = section;
    selectedTopic = null;
    document.querySelectorAll('.nav-links a').forEach(a=>a.classList.remove('active'));
    document.getElementById('nav-'+section).classList.add('active');
    render();
}

function setExam(exam) {
    currentExam = exam;
    selectedTopic = null;
    document.getElementById('btn-mcq').classList.toggle('active', exam==='mcq');
    document.getElementById('btn-saq').classList.toggle('active', exam==='saq');
    render();
}

function setRag(id, rating, evt) {
    if(evt) evt.stopPropagation();
    ragRatings[id] = rating;
    saveRag();
    render();
}

function selectTopic(id) { selectedTopic = (selectedTopic===id)?null:id; render(); }
function formatTime(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

// ===== RENDER ENGINE =====
function render() {
    const app = document.getElementById('app');
    switch(currentSection) {
        case 'notes': app.innerHTML = renderNotes(); break;
        case 'flashcards': app.innerHTML = renderFlashcards(); break;
        case 'mcq-flash': app.innerHTML = renderMCQ(); break;
        case 'saq-flash': app.innerHTML = renderSAQ(); break;
        case 'practice': app.innerHTML = renderPractice(); break;
        case 'podcasts': app.innerHTML = renderPodcasts(); break;
        case 'tips': app.innerHTML = renderTips(); break;
    }
}

function renderTopicGrid(dataSource, prefix) {
    const topics = getTopics();
    let html = '';
    Object.entries(topics).forEach(([cat, items]) => {
        html += `<div class="category-header"><h2>${cat.charAt(0).toUpperCase()+cat.slice(1)}</h2></div><div class="topic-grid">`;
        items.forEach(t => {
            const count = dataSource ? countByTopic(dataSource, t.id) : 0;
            const stats = getRagStats(prefix, t.id);
            html += `<div class="topic-btn ${selectedTopic===t.id?'selected':''}" onclick="selectTopic('${t.id}')">
                <h4>${t.name}</h4>
                <span class="count">${count} cards • CE ${t.ce}</span>
                <div class="rag-dots">
                    ${stats.red?`<span style="color:#ef5350;font-size:0.75rem">${stats.red}🔴</span>`:''}
                    ${stats.amber?`<span style="color:#ffa726;font-size:0.75rem;margin-left:4px">${stats.amber}🟠</span>`:''}
                    ${stats.green?`<span style="color:#66bb6a;font-size:0.75rem;margin-left:4px">${stats.green}🟢</span>`:''}
                </div>
            </div>`;
        });
        html += '</div>';
    });
    return html;
}

function renderRagTable(prefix) {
    const topics = getTopics();
    let html = '<table class="rag-table"><thead><tr><th>Topic</th><th style="text-align:center">🔴 Red</th><th style="text-align:center">🟠 Amber</th><th style="text-align:center">🟢 Green</th><th style="text-align:center">Total</th></tr></thead><tbody>';
    let totalR=0,totalA=0,totalG=0,totalT=0;
    Object.values(topics).flat().forEach(t => {
        const s = getRagStats(prefix, t.id);
        totalR+=s.red; totalA+=s.amber; totalG+=s.green; totalT+=s.total;
        html += `<tr><td>${t.name}</td><td class="rag-cell red">${s.red||'-'}</td><td class="rag-cell amber">${s.amber||'-'}</td><td class="rag-cell green">${s.green||'-'}</td><td class="rag-cell">${s.total||'-'}</td></tr>`;
    });
    html += `<tr style="border-top:2px solid #4fc3f7"><td><strong>TOTAL</strong></td><td class="rag-cell red"><strong>${totalR}</strong></td><td class="rag-cell amber"><strong>${totalA}</strong></td><td class="rag-cell green"><strong>${totalG}</strong></td><td class="rag-cell"><strong>${totalT}</strong></td></tr>`;
    html += '</tbody></table>';
    return html;
}

function renderRagButtons(id) {
    const current = ragRatings[id]||'';
    return `<div class="rag-buttons">
        <button class="rag-btn red ${current==='red'?'active':''}" onclick="setRag('${id}','red',event)"></button>
        <button class="rag-btn amber ${current==='amber'?'active':''}" onclick="setRag('${id}','amber',event)"></button>
        <button class="rag-btn green ${current==='green'?'active':''}" onclick="setRag('${id}','green',event)"></button>
    </div>`;
}

// ===== SECTION RENDERERS =====
function renderNotes() {

    Object.entries(topics).forEach(([cat, items]) => {
        html += `<div class="category-header"><h2>${cat.charAt(0).toUpperCase()+cat.slice(1)}</h2></div>`;

                <h4>Models & Frameworks</h4><ul>${n.models.map(m=>'<li>'+m+'</li>').join('')}</ul>

function renderFlashcards() {
    const topics = getTopics();
    const allIds = getAllTopicIds();
    let html = `<h2 style="color:#4fc3f7;margin-bottom:0.5rem">${currentExam==='mcq'?'MCQ':'SAQ'} — Learning Flashcards</h2>
        <p style="color:#aaa;margin-bottom:1rem">Select a topic to view its flashcards. Click cards to reveal answers. RAG rate your confidence.</p>`;
    // Build flashcards from notes
    let flashcards = [];
    allIds.forEach(id => {
        const n = topicNotes[id]; if(!n) return;
        n.models.forEach((m,i) => flashcards.push({topic:id,front:'Explain: '+m.split('(')[0].trim(),back:m}));
        n.ideas.forEach((idea,i) => flashcards.push({topic:id,front:idea.split(' - ')[0].split(' = ')[0],back:idea}));
    });
    html += renderTopicGrid(flashcards, 'flash-'+currentExam);
    if(selectedTopic) {
        const filtered = flashcards.filter(f=>f.topic===selectedTopic);
        html += `<h3 style="color:#81d4fa;margin:1.5rem 0 0.5rem">${topicNotes[selectedTopic]?.title||selectedTopic} (${filtered.length} cards)</h3>`;
        html += '<div class="flashcard-list">';
        filtered.forEach((card, i) => {
            const id = `flash-${currentExam}-${card.topic}-${i}`;
            html += `<div class="flash-item" onclick="this.classList.toggle('revealed')">
                <div class="flash-q">${card.front}</div>

}

function renderMCQ() {
    const topicIds = getAllTopicIds();
    const questions = mcqQuestions.filter(q=>topicIds.includes(q.topic));

        <p style="color:#aaa;margin-bottom:1rem">IPMA exam-style questions with A, B, C, D options. Click an answer to check. Flip reveals correct answer with explanation.</p>`;

        html += `<h3 style="color:#81d4fa;margin:1.5rem 0 0.5rem">${topicNotes[selectedTopic]?.title||selectedTopic} (${filtered.length} questions)</h3>`;
        filtered.forEach((q, i) => {
            const id = `mcq-${q.topic}-${i}`;

function checkMCQ(qId, selected, correct) {
    const card = document.getElementById(qId);
    if(card.dataset.answered) return;
    card.dataset.answered = 'true';
    const options = card.querySelectorAll('.mcq-option');
    const letters = ['a','b','c','d'];
    options.forEach((opt, idx) => {
        opt.classList.add('disabled');
        if(letters[idx] === correct) opt.classList.add('correct');
        if(letters[idx] === selected && selected !== correct) opt.classList.add('incorrect');
    });
    document.getElementById(qId+'-explain').style.display = 'block';
}

        <h3 style="color:#4fc3f7">⏱ Exam Timer</h3>

function startTimer() { if(timerRunning) return; timerRunning=true; timerInterval=setInterval(()=>{if(timerSeconds>0){timerSeconds--;document.querySelector('.timer-display').textContent=formatTime(timerSeconds);}else{clearInterval(timerInterval);timerRunning=false;alert('⏰ TIME IS UP!');}},1000); }
function pauseTimer() { clearInterval(timerInterval); timerRunning=false; }
function resetTimer() { pauseTimer(); timerSeconds=currentExam==='mcq'?3600:7200; document.querySelector('.timer-display').textContent=formatTime(timerSeconds); }
function setPreset(type) { pauseTimer(); timerSeconds=type==='mcq'?3600:7200; document.querySelector('.timer-display').textContent=formatTime(timerSeconds); }

// Podcast speech controls
let currentPodcastId = null;
let podcastStartTime = 0;
let podcastDuration = 0;
let podcastTimer = null;

function togglePodcast(id) {
    if(currentPodcastId === id && speechSynthesis.speaking) {
        if(speechSynthesis.paused) { speechSynthesis.resume(); document.getElementById('play-'+id).textContent='⏸'; }
        else { speechSynthesis.pause(); document.getElementById('play-'+id).textContent='▶'; }
        return;
    }
    stopAllPodcasts();
    currentPodcastId = id;
    const p = podcastData[id];
    speechUtterance = new SpeechSynthesisUtterance(p.script);
    speechUtterance.rate = speechRate;
    speechUtterance.pitch = 1.05;
    speechUtterance.lang = 'en-GB';
    // Try to get a natural voice
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v=>v.name.includes('Google UK English Male')) || voices.find(v=>v.name.includes('Daniel')) || voices.find(v=>v.lang==='en-GB' && v.localService) || voices[0];
    if(preferred) speechUtterance.voice = preferred;
    podcastDuration = p.script.length / 15; // rough estimate seconds
    podcastStartTime = Date.now();
    speechUtterance.onend = ()=>{ stopPodcast(id); };
    speechSynthesis.speak(speechUtterance);
    document.getElementById('play-'+id).textContent='⏸';
    podcastTimer = setInterval(()=>updatePodcastProgress(id), 500);
}

function stopPodcast(id) {
    speechSynthesis.cancel();
    if(podcastTimer) clearInterval(podcastTimer);
    currentPodcastId = null;
    const btn = document.getElementById('play-'+id);
    if(btn) btn.textContent='▶';
    const prog = document.getElementById('prog-'+id);
    if(prog) prog.style.width='0%';
}

function stopAllPodcasts() {
    speechSynthesis.cancel();
    if(podcastTimer) clearInterval(podcastTimer);
    if(currentPodcastId) {
        const btn = document.getElementById('play-'+currentPodcastId);
        if(btn) btn.textContent='▶';
    }
    currentPodcastId = null;
}

function skipPodcast(id, seconds) {
    // Speech synthesis doesn't support seeking, so restart with offset approximation
    if(currentPodcastId !== id) return;
    // Can't truly skip in web speech API, but we note the intent
}

function cycleSpeed(id) {
    const speeds = [0.8, 1.0, 1.2, 1.5, 1.8];
    const current = speeds.indexOf(speechRate);
    speechRate = speeds[(current+1) % speeds.length];
    document.getElementById('speed-'+id).textContent = speechRate+'x';
    if(currentPodcastId === id && speechSynthesis.speaking) {
        // Restart with new speed
        const p = podcastData[id];
        speechSynthesis.cancel();
        speechUtterance = new SpeechSynthesisUtterance(p.script);
        speechUtterance.rate = speechRate;
        speechUtterance.pitch = 1.05;
        speechUtterance.lang = 'en-GB';
        speechUtterance.onend = ()=>{ stopPodcast(id); };
        speechSynthesis.speak(speechUtterance);
        document.getElementById('play-'+id).textContent='⏸';
    }
}

function updatePodcastProgress(id) {
    if(!currentPodcastId || currentPodcastId !== id) return;
    const elapsed = (Date.now() - podcastStartTime) / 1000;
    const pct = Math.min((elapsed / podcastDuration) * 100, 100);
    const prog = document.getElementById('prog-'+id);
    if(prog) prog.style.width = pct+'%';
    const timeEl = document.getElementById('time-'+id);
    if(timeEl) timeEl.textContent = formatTime(Math.floor(elapsed)) + ' / ' + podcastData[id].duration;
}

function seekPodcast(evt, id) {
    // Visual feedback only - speech API doesn't support seeking
    const rect = evt.target.getBoundingClientRect();
    const pct = ((evt.clientX - rect.left) / rect.width) * 100;
    document.getElementById('prog-'+id).style.width = pct+'%';
}

        '• Duration: 120 minutes<br>• 14 questions, answer any 12<br>• 120 marks (10 per question — typically 2 sub-parts of 5 marks)<br>• Pass: ~60% (72/120)<br>• Topics: Governance, Power, Culture, Relationships, Leadership, Teamwork, Conflict, Resourcefulness, Time, Organisation, Quality, Finance, Resources, Stakeholders'
