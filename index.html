// ===== PODCAST DATA =====
const podcastData = {
    'strategy': {title:'Strategy',script:'Strategy in IPMA is about ensuring your project aligns with the organisation\'s strategic objectives. Think of it like this: a project that delivers on time and budget but doesn\'t contribute to the organisation\'s goals is NOT a success. The key models are PESTLE for scanning the external environment, SWOT for internal/external analysis, and the Balanced Scorecard for measuring strategic performance across four perspectives. Remember: Vision cascades down to Mission, then Strategy, Portfolio, Programme, and finally Project. The business case is your golden thread linking project to strategy. A memorable example: Kodak invented digital photography but their projects focused on film—strategically misaligned projects that led to bankruptcy despite technical excellence.'},
    'compliance': {title:'Compliance, Standards & Regulations',script:'Compliance is non-negotiable. If your project objective conflicts with the law, the law wins every time. Think of standards in two buckets: mandatory (regulations like GDPR, health and safety law) and voluntary (best practice like ISO 21500, PRINCE2). Key point for exams: professional ethics means transparency, honesty, and responsibility. A memorable example: the Grenfell Tower tragedy showed what happens when compliance with fire safety regulations is treated as optional. The project manager\'s duty of care is paramount—no schedule or budget pressure justifies compromising safety.'},
    'self-reflection': {title:'Self-Reflection & Self-Management',script:'Self-reflection is the foundation of personal effectiveness. The Johari Window is your go-to model—imagine a 2x2 grid. The "Blind Spot" quadrant is what others see but you don\'t. That\'s why 360-degree feedback is so powerful. Kolb\'s Learning Cycle reminds us that experience alone isn\'t enough—you must reflect on it, conceptualise it, and experiment with new approaches. Goleman\'s Emotional Intelligence has five components, but for the exam, remember: self-awareness comes first because you can\'t manage others until you manage yourself. Memorable example: a PM who always micromanaged received 360 feedback revealing the team felt distrusted—this blind spot was reducing performance, not improving it.'},
    'integrity': {title:'Personal Integrity & Reliability',script:'Trust is your most valuable currency as a project manager. The Trust Equation is brilliant: Trust equals Credibility plus Reliability plus Intimacy, all divided by Self-Orientation. The lower your self-orientation (how much it\'s about YOU), the more people trust you. Reliability means doing what you say you\'ll do—every time. It\'s built slowly through consistent behaviour but destroyed instantly by one broken promise. Memorable example: a PM who always gave honest project status reports—even bad news—was trusted by the board. When they asked for emergency budget, it was granted immediately because their track record of transparency meant the board believed the request was genuine.'},
    'communication': {title:'Personal Communication',script:'Here\'s the stat that sticks: project managers spend approximately 70% of their time communicating. Mehrabian\'s 7-38-55 rule tells us words carry only 7% of emotional meaning—tone carries 38% and body language 55%. But be careful—this applies to emotional/attitudinal messages, not all communication! The Shannon-Weaver model reminds us that "noise" distorts messages—noise can be physical, psychological, or semantic. Push communication goes TO people; Pull makes information AVAILABLE. A memorable example: a PM sent a critical risk report by email (push) but the sponsor was travelling and missed it. Had they also called (interactive), the risk could have been escalated earlier. The lesson: important messages need redundant channels.'},
    'negotiation': {title:'Negotiation',script:'The Harvard Principled Negotiation approach has four pillars you must remember: separate people from the problem, focus on interests not positions, invent options for mutual gain, and use objective criteria. BATNA is your power source—if you have a strong alternative, you negotiate from strength. Here\'s the exam-winning insight: interests differ from positions. A position is "I want this meeting room." An interest is "I need a quiet space for a client call." Understanding interests opens up creative solutions. Memorable example: two project teams fighting over the same developer (positions). Investigation revealed one needed architecture design (weeks 1-3), the other needed coding (weeks 4-8)—sequential sharing satisfied both interests with zero compromise.'},
    'results': {title:'Results Orientation',script:'Results orientation is about focusing on outcomes, not just activities. The distinction matters: outputs are what you deliver (a system), outcomes are the changes that result (staff work more efficiently), benefits are the measurable improvements (30% cost reduction). SMART objectives are fundamental—if you can\'t measure it, you can\'t manage it. MoSCoW prioritisation is your friend for scope decisions: Must, Should, Could, Won\'t. The PDCA cycle (Plan-Do-Check-Act) drives continuous improvement. Memorable example: a project delivered a perfect CRM system (output) but nobody used it because change management was neglected—zero outcomes, zero benefits despite technical delivery success.'},

    'design': {title:'Project Design',script:'Project design is where strategy meets execution. The business case is your key document—it contains strategic fit, options appraisal, benefits, costs, risks and timescales. It\'s a living document reviewed at every gate. Your methodology choice (Waterfall, Agile, Hybrid) depends on uncertainty and complexity—stable requirements suit Waterfall; evolving requirements suit Agile. Gate reviews are go/no-go decision points between phases. Memorable example: a project chose Waterfall for a regulatory system with fixed requirements and Agile for the customer-facing app with evolving needs—hybrid approach matching methodology to context, not dogma.'},
    'requirements': {title:'Requirements & Objectives',script:'Requirements define WHAT you need, not HOW you\'ll build it. The hierarchy matters: Business requirements (why), Stakeholder requirements (who needs what), Solution requirements (functional and non-functional), Transition requirements (how to get there). The Kano Model is exam-gold: Basic needs (expected—dissatisfaction if absent), Performance needs (more is better), Excitement needs (unexpected delight). Scope creep often starts with ambiguous requirements. Memorable example: "the system should be fast" is ambiguous. "Page load under 2 seconds for 95% of requests" is measurable. The second version can be tested; the first invites endless scope creep.'},
    'scope': {title:'Scope',script:'Scope is about boundaries—what\'s IN and what\'s OUT. The WBS is your cornerstone tool—a deliverable-oriented hierarchical decomposition following the 100% rule (captures ALL work). The scope statement should explicitly list inclusions, exclusions, assumptions and constraints. Scope creep is uncontrolled expansion without formal change control. Gold plating is the team adding unrequested features. Both are harmful. Memorable example: a developer adding a "cool" dashboard feature nobody asked for (gold plating) introduced a bug that delayed the critical path by 2 weeks. The lesson: if it\'s not in the scope baseline, it needs change control.'},
    'procurement': {title:'Procurement',script:'Procurement is about getting the best from external providers. The make-or-buy decision considers capability, capacity, cost and control. Contract types allocate risk: Fixed Price puts risk on the seller (they eat overruns), Cost Plus puts risk on the buyer (you pay whatever it costs plus a fee), Time & Materials splits risk. The Kraljic Matrix classifies purchases by supply risk and profit impact—strategic items need partnerships, leverage items need competitive bidding. Memorable example: a company used fixed-price for well-defined construction (low risk of change) but cost-plus for innovative R&D (impossible to predict effort)—matching contract risk allocation to uncertainty.'},
    'plan-control': {title:'Plan & Control',script:'EVM is the most exam-tested topic here. Three baseline values: PV (what you planned to spend by now), EV (value of work actually completed), AC (what you actually spent). Key formulas: SV = EV - PV (schedule), CV = EV - AC (cost). SPI = EV/PV, CPI = EV/AC. Below 1 is bad for both. EAC = BAC/CPI forecasts final cost. The concept of tolerances is crucial: they define the acceptable variation before you MUST escalate. Rolling Wave Planning means detail for near-term, summary for future. Memorable example: SPI of 0.8 at month 3 of a 12-month project means you\'re only delivering 80% of planned progress—without action, you\'ll finish 20% late.'},
    'risk': {title:'Risk & Opportunity',script:'Risk is uncertainty that MATTERS—it can be positive (opportunity) or negative (threat). The process is: Identify, Assess (probability × impact), Plan Responses, Monitor. Threat responses: Avoid (eliminate), Transfer (insurance/contract), Mitigate (reduce P or I), Accept. Opportunity responses: Exploit (make certain), Share (partner), Enhance (increase P or I), Accept. Key concepts: risk appetite (how much you\'ll tolerate), residual risk (what remains after response), secondary risk (created by your response). Memorable example: a risk response of outsourcing development (transfer) created a secondary risk of knowledge dependency on the supplier—the response itself needed managing.'},
    'change': {title:'Change & Transformation',script:'Change management is about PEOPLE, not processes. Kotter\'s 8 Steps are the most-tested model: start with Urgency, build a Coalition, create a Vision, Communicate it, Empower people, generate Quick Wins, Consolidate gains, Anchor in culture. Lewin says: Unfreeze (create dissatisfaction with current state), Change (transition), Refreeze (make new state permanent). ADKAR works at individual level: Awareness, Desire, Knowledge, Ability, Reinforcement. The Change Curve shows emotional journey: Denial → Resistance → Exploration → Commitment. Memorable example: a brilliant system failed because nobody told staff WHY it was needed (no Awareness in ADKAR). Without understanding the "why," desire to change never developed.'},
    'governance': {title:'Governance, Structures & Processes',script:'Governance answers: who makes decisions, how are they made, and how is performance overseen? The project board or steering committee provides strategic direction, the sponsor is the single accountable person, and the PM delivers day-to-day. RACI matrices clarify who does what—remember, only ONE "A" per activity. Stage gates are go/no-go checkpoints. The PMO provides support and standards. Escalation paths must be defined BEFORE issues arise. Memorable example: a project without clear governance had three different directors each believing they were the decision-maker—conflicting instructions caused 6 weeks of rework before a RACI was established.'},
    'power': {title:'Power & Interest',script:'Power in organisations isn\'t just about hierarchy. French and Raven identified six sources: Legitimate (your title), Reward (what you can give), Coercive (what you can threaten), Expert (your knowledge), Referent (your charisma), Informational (what you know). In matrix organisations, PMs typically lack legitimate power over team members—so expert and referent power become critical. Mendelow\'s grid maps stakeholders by power and interest. Memorable example: a junior PM couldn\'t get resources from a functional manager using legitimate authority. But by demonstrating expert knowledge of the technology (expert power) and consistently delivering on promises (building referent power), they earned the respect that made the functional manager WANT to support their project.'},
    'culture': {title:'Culture & Values',script:'Culture is "how we do things around here"—Schein says it operates at three levels: Artefacts (what you see), Espoused Values (what they say), Basic Assumptions (what they actually believe). The gap between level 2 and 3 is where problems hide. Hofstede gives us national culture dimensions—Power Distance and Uncertainty Avoidance most affect project management. Handy describes four organisational cultures: Power (central control), Role (bureaucracy), Task (project-focused), Person (individual-focused). Memorable example: a company said "we empower teams" (espoused value) but every decision needed director approval (basic assumption of control). The PM who understood this didn\'t fight it—they scheduled pre-approvals, working with the real culture rather than the stated one.'},
    'relationships': {title:'Relationships & Engagement',script:'Relationships are built on trust, which requires three things: Competence (you can deliver), Consistency (you\'re predictable), and Care (you have their interests at heart). The Stakeholder Engagement Assessment Matrix tracks current vs desired engagement levels: Unaware, Resistant, Neutral, Supportive, Leading. The gap tells you how much work is needed. Memorable example: a PM inherited a project with a resistant finance director. Rather than avoiding them, the PM scheduled monthly coffees, asked about their concerns, incorporated their feedback into budget reporting format, and delivered early financial forecasts. Within 3 months, the FD became the project\'s strongest advocate—the relationship investment paid compound returns.'},
    'leadership': {title:'Leadership',script:'Leadership and management are complementary but different. Management is doing things right (efficiency); Leadership is doing the right things (effectiveness). Situational Leadership (Hersey-Blanchard) says adapt style to follower readiness: Direct new people, Coach developing people, Support capable-but-uncertain people, Delegate to experienced self-starters. Adair\'s three circles (Task, Team, Individual) must be balanced. Memorable example: a PM used the same directive style with everyone—graduates thrived with clear direction, but experienced architects felt micromanaged and disengaged. After learning Situational Leadership, the PM delegated fully to architects while coaching graduates—both groups\' performance improved dramatically.'},
    'teamwork': {title:'Teamwork',script:'Tuckman is your anchor model: Forming (polite uncertainty), Storming (conflict and power struggles), Norming (agreements and cohesion), Performing (autonomous high performance), Adjourning (closure). The PM\'s role changes at each stage. Belbin shows that team role diversity matters—a team of all creative types generates brilliant ideas but never delivers. Lencioni\'s 5 Dysfunctions start with absence of trust—without trust, there\'s no honest conflict; without honest conflict, there\'s no genuine commitment. Memorable example: a team stuck in permanent "norming" (artificial harmony) never challenged bad ideas because they feared conflict. The PM deliberately introduced structured debate (Edward de Bono\'s techniques), creating safe disagreement that dramatically improved solution quality.'},
    'conflict': {title:'Conflict & Crisis',script:'Not all conflict is bad—constructive disagreement improves decisions. Thomas-Kilmann gives five modes: Competing (I win, you lose), Collaborating (we both win), Compromising (we both give something up), Avoiding (nobody addresses it), Accommodating (I let you win). Choose based on urgency, importance, and relationship value. For crisis management: Assess, Communicate, Decide, Act, Review. Memorable example: two team leads had a technical disagreement that was actually productive—each had valid points. Rather than forcing a quick compromise, the PM facilitated collaboration: they explored both approaches, and the resulting hybrid solution was better than either original proposal.'},
    'resourcefulness': {title:'Resourcefulness',script:'Resourcefulness is creativity under constraints. De Bono\'s Six Thinking Hats force structured thinking: White (facts), Red (feelings), Black (risks), Yellow (benefits), Green (creative ideas), Blue (process management). Root Cause Analysis using 5 Whys prevents treating symptoms. Design Thinking (Empathise, Define, Ideate, Prototype, Test) brings user-centred innovation. Memorable example: facing a 30% budget cut, a PM used Green Hat thinking with the team. Instead of cutting scope, they identified three deliverables that could use open-source components, two that a university partner could develop as research projects, and one that an existing system could deliver with minor modification. Full scope delivered at 70% of original cost.'},
    'time': {title:'Time',script:'Critical Path Method is fundamental: it\'s the longest path through your network, determining minimum duration. Activities on it have zero float—any delay extends the end date. PERT uses three-point estimates: (O + 4M + P) / 6 for expected duration. Compression techniques: Crashing adds resources (costs more), Fast-tracking does things in parallel (more risk). Dependencies: Finish-to-Start is most common. Memorable example: a project had two paths—critical at 20 weeks and near-critical at 19 weeks with 1 week float. The PM focused solely on the critical path. When an unexpected 2-week delay hit the near-critical path, it became the new critical path, causing a 1-week project delay. Lesson: monitor near-critical paths too.'},
    'organisation': {title:'Organisation & Information',script:'A clear organisation structure prevents confusion. RACI matrices assign Responsible, Accountable, Consulted, Informed roles. Configuration Management ensures everyone uses the right version of every document and deliverable—identification, control, status accounting, verification. Knowledge Management (create, store, share, use) preserves organisational learning. Memorable example: a team spent 3 days building a component that had already been developed on a sister project. Without knowledge management, the £15k duplication was invisible until code review. A simple shared component library would have prevented it.'},
    'quality': {title:'Quality',script:'Quality means conformance to requirements AND fitness for purpose—both matter. Quality Assurance asks "are we following the right processes?" (preventive). Quality Control asks "does the product meet standards?" (detective). The Cost of Quality model is powerful: Prevention costs (5-10%) and Appraisal costs (10-15%) are investments that reduce Internal Failure (15-25%) and External Failure costs (25-50%+). PDCA (Plan-Do-Check-Act) drives continuous improvement. Memorable example: a team skipped code reviews to save time (reduced prevention cost). Defect rate tripled, testing took 40% longer, and two production incidents cost £200k in failure costs. The "saving" of £10k in review time cost 20× more in failures.'},
    'finance': {title:'Finance',script:'EVM integrates scope, schedule and cost. Three numbers tell the story: PV (planned value—what you planned to spend), EV (earned value—value of work done), AC (actual cost—what you spent). SPI = EV/PV tells schedule health. CPI = EV/AC tells cost health. Below 1 is bad for both. EAC = BAC/CPI forecasts where you\'ll end up. The cone of uncertainty means early estimates are ±75% but narrow to ±5% by execution. Memorable example: at month 6, PV=£600k, EV=£500k, AC=£550k. SPI=0.83 (behind schedule), CPI=0.91 (over budget). EAC=£1M/0.91=£1.1M. The PM presented this to the board with options: accept overrun, reduce scope, or add resources to recover. Data-driven decisions, not panic.'},
    'resources': {title:'Resources',script:'Resource management in matrix organisations is about negotiation and influence since PMs lack direct authority. Resource Levelling resolves over-allocation by delaying activities (may extend end date). Resource Smoothing uses float to reduce peaks (keeps end date). Skills matrices identify capability gaps. Memorable example: a specialist was allocated to three projects at 40% each (120% total). Rather than fighting other PMs for priority, the PM proposed sequencing: 100% for 2 critical weeks on each project in turn. All three PMs got what they needed by coordinating rather than competing for the same person simultaneously.'},
    'stakeholders': {title:'Stakeholders',script:'Stakeholders can make or break your project. The process: Identify (use multiple lenses—org chart, categories, impact analysis), Analyse (Power/Interest grid, Salience model), Plan (tailored engagement strategies), Engage (execute communications and involvement), Monitor (attitudes change—reassess regularly). The Engagement Assessment Matrix tracks current vs desired states. Memorable example: a PM identified the CEO\'s PA as a key stakeholder nobody else had considered. The PA controlled diary access and meeting priorities. By keeping the PA informed and building rapport, the PM got faster sponsor decisions than PMs who only focused on "important" stakeholders by job title.'}
};

// ===== EXAM TIPS DATA =====
const examTips = {
    mcq: [
        {title:'Time Management',tip:'You have 60 questions in 60 minutes = 1 minute per question. If stuck, mark it and move on. Don\'t spend 3 minutes on one question.'},
        {title:'Elimination Strategy',tip:'Eliminate obviously wrong answers first. Usually 2 options are clearly wrong, leaving a 50/50 choice. Look for absolute words like "always" or "never" - these are often wrong.'},
        {title:'Read Carefully',tip:'Read the WHOLE question including all options before answering. The question may say "all EXCEPT" or "which is NOT" - missing these words costs easy marks.'},
        {title:'ICB4 Language',tip:'Use IPMA/ICB4 terminology in your thinking. If an option uses ICB4 language correctly, it\'s more likely correct. IPMA has specific definitions.'},
        {title:'Best vs Correct',tip:'Some questions ask for the BEST answer. Multiple options may be partially correct, but one is the MOST correct in IPMA context. Think "what would IPMA say?"'},
        {title:'Context Matters',tip:'IPMA favours collaborative, people-centred approaches. If in doubt between a command-control option and a collaborative one, choose collaborative.'},
        {title:'Models and Frameworks',tip:'Know the key models by name and their components. Questions often test whether you know which model has which elements (e.g., Kotter has 8 steps, not 5).'},
        {title:'Don\'t Overthink',tip:'Your first instinct is usually correct. Don\'t change answers unless you\'re certain your first choice was wrong. Overthinking often leads to selecting more complex (wrong) answers.'},
        {title:'Practice Under Pressure',tip:'Do timed practice papers to build exam stamina. The pressure of time affects decision-making - get comfortable with the pace.'},
        {title:'Competence Elements',tip:'Remember the ICB4 structure: Perspective (context), People (interpersonal), Practice (technical). Questions are drawn from all three areas for MCQ.'}
    ],
    saq: [
        {title:'Structure Your Answer',tip:'Use the 5-bullet approach: Definition/concept → Key elements/components → Application/how to use → Example → Link back to project success. This ensures breadth AND depth.'},
        {title:'Time Allocation',tip:'2 hours for 12 questions (answer 12 of 14) = 10 minutes per question. Spend 1 min reading, 8 min writing, 1 min reviewing. Stick to this rigidly.'},
        {title:'Choose Wisely',tip:'You have 14 questions but only answer 12. Read ALL questions first (5 mins), then choose the 12 you\'re most confident about. Don\'t waste time on weak topics.'},
        {title:'Use Models and Theories',tip:'Name-drop models with brief explanation. "Using Tuckman\'s model (Forming, Storming, Norming, Performing), the team..." shows theoretical knowledge applied practically.'},
        {title:'Give Examples',tip:'Every answer benefits from a brief practical example. It doesn\'t need to be real - a plausible scenario shows you understand application, not just theory.'},
        {title:'Answer the Question Asked',tip:'If the question says "explain" - define and describe. If it says "compare" - show similarities AND differences. If it says "evaluate" - give pros, cons and judgement.'},
        {title:'5 Marks Breakdown',tip:'Typically: 1 mark for definition, 1 mark for key concepts/models, 1 mark for application/how, 1 mark for example, 1 mark for depth/critical analysis. Hit all five.'},
        {title:'Breadth AND Depth',tip:'Don\'t write everything you know about one sub-topic. Cover the breadth of the question then add depth to 2-3 key points. Examiners want range of knowledge.'},
        {title:'Link to PM Context',tip:'Always relate your answer back to project management. Generic management theory needs PM application. Ask: "How does this help deliver a project?"'},
        {title:'Quality Over Quantity',tip:'A concise, well-structured answer with clear points scores better than 2 pages of waffle. Bullet points and short paragraphs are fine - clarity wins.'},
        {title:'Read Mark Scheme',tip:'Each question is worth 5 marks, totalling 60 marks from 12 questions (120 marks total, 10 marks per question - 2 sub-parts worth 5 each, OR a single 10-mark response). Ensure proportional effort.'},
        {title:'Keyword Density',tip:'Include relevant technical keywords: competence element names, model names, IPMA terminology. Examiners scan for evidence of knowledge - make it easy for them to give marks.'}
    ]
};

// ===== APP STATE =====
let currentSection = 'notes';
let currentExam = 'mcq';
let ragRatings = JSON.parse(localStorage.getItem('ipma-rag') || '{}');
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let currentFilter = 'all';

// ===== CORE FUNCTIONS =====
function showSection(section) {
    currentSection = section;
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    event.target.classList.add('active');
    render();
}

function setExam(exam) {
    currentExam = exam;
    document.querySelectorAll('.exam-toggle button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    render();
}

function setRag(id, rating) {
    ragRatings[id] = rating;
    localStorage.setItem('ipma-rag', JSON.stringify(ragRatings));
    const btns = document.querySelectorAll(`[data-rag-id="${id}"] .rag-btn`);
    btns.forEach(b => { b.classList.remove('active-red','active-amber','active-green'); });
    const activeBtn = document.querySelector(`[data-rag-id="${id}"] .rag-btn.${rating}`);
    if(activeBtn) activeBtn.classList.add(`active-${rating}`);
    updateProgress();
}

function getRagClass(id) { return ragRatings[id] || ''; }

function updateProgress() {
    const progressEl = document.getElementById('progress-bar');
    if(!progressEl) return;
    const total = Object.keys(ragRatings).length;
    const green = Object.values(ragRatings).filter(r => r === 'green').length;
    const amber = Object.values(ragRatings).filter(r => r === 'amber').length;
    const red = Object.values(ragRatings).filter(r => r === 'red').length;
    if(total === 0) return;
    const greenPct = (green/total)*100;
    const amberPct = (amber/total)*100;
    const redPct = (red/total)*100;
    progressEl.innerHTML = `<div style="display:flex;height:100%;border-radius:10px;overflow:hidden"><div style="width:${greenPct}%;background:#66bb6a"></div><div style="width:${amberPct}%;background:#ffa726"></div><div style="width:${redPct}%;background:#ef5350"></div></div>`;
}

function flipCard(el) { el.classList.toggle('flipped'); }

function getTopics() { return currentExam === 'mcq' ? mcqTopics : saqTopics; }

function getAllTopicIds() {
    const topics = getTopics();
    let ids = [];
    Object.values(topics).forEach(cat => cat.forEach(t => ids.push(t.id)));
    return ids;
}

// ===== RENDER FUNCTIONS =====
function render() {
    const app = document.getElementById('app');
    switch(currentSection) {
        case 'notes': app.innerHTML = renderNotes(); break;
        case 'flashcards': app.innerHTML = renderFlashcards(); break;
        case 'mcq-flash': app.innerHTML = renderMCQFlash(); break;
        case 'saq-flash': app.innerHTML = renderSAQFlash(); break;
        case 'practice': app.innerHTML = renderPractice(); break;
        case 'podcasts': app.innerHTML = renderPodcasts(); break;
        case 'tips': app.innerHTML = renderTips(); break;
    }
    updateProgress();
}

function renderFilterBar() {
    const topics = getTopics();
    let html = '<div class="filter-bar"><button class="filter-btn '+(currentFilter==='all'?'active':'')+'" onclick="setFilter(\'all\')">All</button>';
    Object.entries(topics).forEach(([cat, items]) => {
        html += `<button class="filter-btn ${currentFilter===cat?'active':''}" onclick="setFilter('${cat}')">${cat.charAt(0).toUpperCase()+cat.slice(1)}</button>`;
    });
    html += '</div>';
    return html;
}

function setFilter(f) { currentFilter = f; render(); }

function renderNotes() {
    const topics = getTopics();
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">${currentExam==='mcq'?'MCQ':'SAQ'} Exam - Topic Notes</h2>`;
    html += renderFilterBar();
    Object.entries(topics).forEach(([category, items]) => {
        if(currentFilter !== 'all' && currentFilter !== category) return;
        html += `<div class="category-header"><h2>${category.charAt(0).toUpperCase()+category.slice(1)}</h2></div>`;
        items.forEach(topic => {
            const notes = topicNotes[topic.id];
            if(!notes) return;
            html += `<div class="topic-card">
                <h3>${notes.title}</h3>
                <p><strong>Definition:</strong> ${notes.definition}</p>
                <h4>Key Competencies</h4><ul>${notes.keyCompetencies.map(c=>`<li>${c}</li>`).join('')}</ul>
                <h4>Models & Frameworks</h4><ul>${notes.models.map(m=>`<li>${m}</li>`).join('')}</ul>
                <h4>Key Ideas</h4><ul>${notes.keyIdeas.map(i=>`<li>${i}</li>`).join('')}</ul>
            </div>`;
        });
    });
    return html;
}

function renderFlashcards() {
    const topics = getTopics();
    const topicIds = getAllTopicIds();
    const cards = learningFlashcards.filter(c => topicIds.includes(c.topic));
    const filtered = currentFilter === 'all' ? cards : cards.filter(c => {
        const catTopics = topics[currentFilter];
        return catTopics && catTopics.some(t => t.id === c.topic);
    });
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">${currentExam==='mcq'?'MCQ':'SAQ'} - Learning Flashcards</h2>`;
    html += renderFilterBar();
    html += renderProgressStats('flash');
    html += '<div class="flashcard-container">';
    filtered.forEach((card, i) => {
        const id = `flash-${currentExam}-${card.topic}-${i}`;
        const rag = getRagClass(id);
        html += `<div class="flashcard" onclick="flipCard(this)">
            <div class="flashcard-inner">
                <div class="flashcard-front" style="border-color:${rag==='green'?'#66bb6a':rag==='amber'?'#ffa726':rag==='red'?'#ef5350':'#4fc3f7'}">
                    <span style="font-size:0.75rem;color:#aaa;margin-bottom:0.5rem">${card.topic}</span>
                    <p style="font-size:1.1rem">${card.front}</p>
                </div>
                <div class="flashcard-back">
                    <p>${card.back}</p>
                </div>
            </div>
            <div class="rag-buttons" data-rag-id="${id}" onclick="event.stopPropagation()">
                <button class="rag-btn red ${rag==='red'?'active-red':''}" onclick="setRag('${id}','red')">🔴 Red</button>
                <button class="rag-btn amber ${rag==='amber'?'active-amber':''}" onclick="setRag('${id}','amber')">🟠 Amber</button>
                <button class="rag-btn green ${rag==='green'?'active-green':''}" onclick="setRag('${id}','green')">🟢 Green</button>
            </div>
        </div>`;
    });
    html += '</div>';
    return html;
}

function renderMCQFlash() {
    const filtered = currentFilter === 'all' ? mcqQuestions : mcqQuestions.filter(q => {
        const topics = mcqTopics[currentFilter];
        return topics && topics.some(t => t.id === q.topic);
    });
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">MCQ Flashcards (${filtered.length} questions)</h2>`;
    html += renderFilterBar();
    html += renderProgressStats('mcq');
    html += '<div class="flashcard-container">';
    filtered.forEach((q, i) => {
        const id = `mcq-${q.topic}-${i}`;
        const rag = getRagClass(id);
        html += `<div class="flashcard" onclick="flipCard(this)">
            <div class="flashcard-inner">
                <div class="flashcard-front" style="border-color:${rag==='green'?'#66bb6a':rag==='amber'?'#ffa726':rag==='red'?'#ef5350':'#4fc3f7'}">
                    <span style="font-size:0.75rem;color:#aaa;margin-bottom:0.5rem">${q.topic}</span>
                    <p style="font-size:0.95rem">${q.q}</p>
                </div>
                <div class="flashcard-back">
                    <p style="color:#66bb6a;font-weight:bold;margin-bottom:0.5rem">✓ ${q.options[q.answer]}</p>
                    <ul>${q.options.map((o,idx) => `<li style="color:${idx===q.answer?'#66bb6a':'#aaa'}">${String.fromCharCode(65+idx)}) ${o}</li>`).join('')}</ul>
                </div>
            </div>
            <div class="rag-buttons" data-rag-id="${id}" onclick="event.stopPropagation()">
                <button class="rag-btn red ${rag==='red'?'active-red':''}" onclick="setRag('${id}','red')">🔴</button>
                <button class="rag-btn amber ${rag==='amber'?'active-amber':''}" onclick="setRag('${id}','amber')">🟠</button>
                <button class="rag-btn green ${rag==='green'?'active-green':''}" onclick="setRag('${id}','green')">🟢</button>
            </div>
        </div>`;
    });
    html += '</div>';
    return html;
}

function renderSAQFlash() {
    const topicIds = getAllTopicIds();
    const cards = saqQuestions.filter(c => topicIds.includes(c.topic));
    const filtered = currentFilter === 'all' ? cards : cards.filter(q => {
        const topics = saqTopics[currentFilter];
        return topics && topics.some(t => t.id === q.topic);
    });
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">SAQ Flashcards (${filtered.length} questions)</h2>`;
    html += renderFilterBar();
    html += renderProgressStats('saq');
    html += '<div class="flashcard-container">';
    filtered.forEach((q, i) => {
        const id = `saq-${q.topic}-${i}`;
        const rag = getRagClass(id);
        html += `<div class="flashcard" style="height:350px" onclick="flipCard(this)">
            <div class="flashcard-inner">
                <div class="flashcard-front" style="border-color:${rag==='green'?'#66bb6a':rag==='amber'?'#ffa726':rag==='red'?'#ef5350':'#4fc3f7'}">
                    <span style="font-size:0.75rem;color:#aaa;margin-bottom:0.5rem">${q.topic}</span>
                    <p style="font-size:1rem">${q.q}</p>
                    <p style="font-size:0.7rem;color:#666;margin-top:1rem">Click to reveal 5 bullet points + example answer</p>
                </div>
                <div class="flashcard-back" style="font-size:0.8rem">
                    <p style="color:#4fc3f7;font-weight:bold;margin-bottom:0.5rem">Key Points:</p>
                    <ul>${q.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                    <p style="color:#ffa726;font-weight:bold;margin-top:0.5rem">5/5 Example:</p>
                    <p style="font-size:0.75rem">${q.example.substring(0,300)}...</p>
                </div>
            </div>
            <div class="rag-buttons" data-rag-id="${id}" onclick="event.stopPropagation()">
                <button class="rag-btn red ${rag==='red'?'active-red':''}" onclick="setRag('${id}','red')">🔴</button>
                <button class="rag-btn amber ${rag==='amber'?'active-amber':''}" onclick="setRag('${id}','amber')">🟠</button>
                <button class="rag-btn green ${rag==='green'?'active-green':''}" onclick="setRag('${id}','green')">🟢</button>
            </div>
        </div>`;
    });
    html += '</div>';
    return html;
}

function renderProgressStats(prefix) {
    let total = 0, green = 0, amber = 0, red = 0;
    Object.entries(ragRatings).forEach(([k,v]) => {
        if(k.startsWith(prefix) || (prefix === 'flash' && k.startsWith('flash'))) {
            total++;
            if(v==='green') green++;
            else if(v==='amber') amber++;
            else if(v==='red') red++;
        }
    });
    return `<div class="stats-panel">
        <h3 style="color:#4fc3f7;margin-bottom:0.5rem">Progress Tracker</h3>
        <div class="stats-grid">
            <div class="stat-box"><div class="number" style="color:#66bb6a">${green}</div><div class="label">Green ✓</div></div>
            <div class="stat-box"><div class="number" style="color:#ffa726">${amber}</div><div class="label">Amber ~</div></div>
            <div class="stat-box"><div class="number" style="color:#ef5350">${red}</div><div class="label">Red ✗</div></div>
            <div class="stat-box"><div class="number">${total}</div><div class="label">Rated</div></div>
        </div>
        <div class="progress-bar" id="progress-bar"></div>
    </div>`;
}

function renderPractice() {
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">Practice Papers - Timed Conditions</h2>`;
    html += `<div class="stats-panel">
        <h3 style="color:#4fc3f7">Exam Timer</h3>
        <p style="color:#aaa;margin:0.5rem 0">${currentExam==='mcq'?'MCQ: 60 minutes for 60 questions':'SAQ: 120 minutes for 12 questions (choose 12 of 14)'}</p>
        <div class="timer-display" id="timer">${formatTime(timerSeconds)}</div>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="startTimer()">▶ Start</button>
            <button class="btn btn-secondary" onclick="pauseTimer()">⏸ Pause</button>
            <button class="btn btn-secondary" onclick="resetTimer()">↺ Reset</button>
            <button class="btn btn-secondary" onclick="setTimerPreset('mcq')">Set MCQ (60 min)</button>
            <button class="btn btn-secondary" onclick="setTimerPreset('saq')">Set SAQ (120 min)</button>
        </div>
    </div>`;

    if(currentExam === 'mcq') {
        html += `<div class="stats-panel">
            <h3 style="color:#4fc3f7">MCQ Practice Paper</h3>
            <p style="color:#aaa;margin:0.5rem 0">60 questions, 60 marks, 60 minutes. Answer ALL questions. Click to reveal answers after attempting.</p>
            <button class="btn btn-primary" onclick="generateMCQPaper()" style="margin:1rem 0">Generate New Paper</button>
            <div id="practice-paper"></div>
        </div>`;
    } else {
        html += `<div class="stats-panel">
            <h3 style="color:#4fc3f7">SAQ Practice Paper</h3>
            <p style="color:#aaa;margin:0.5rem 0">14 questions presented - answer any 12. Each scored out of 5 marks (some questions have 2 parts). 120 minutes total.</p>
            <button class="btn btn-primary" onclick="generateSAQPaper()" style="margin:1rem 0">Generate New Paper</button>
            <div id="practice-paper"></div>
        </div>`;
    }
    return html;
}

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startTimer() {
    if(timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
        if(timerSeconds > 0) {
            timerSeconds--;
            document.getElementById('timer').textContent = formatTime(timerSeconds);
        } else {
            clearInterval(timerInterval);
            timerRunning = false;
            alert('⏰ Time is up! Stop writing.');
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
}

function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = currentExam === 'mcq' ? 3600 : 7200;
    document.getElementById('timer').textContent = formatTime(timerSeconds);
}

function setTimerPreset(type) {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = type === 'mcq' ? 3600 : 7200;
    document.getElementById('timer').textContent = formatTime(timerSeconds);
}

function generateMCQPaper() {
    const shuffled = [...mcqQuestions].sort(() => Math.random() - 0.5).slice(0, 60);
    let html = '';
    shuffled.forEach((q, i) => {
        html += `<div class="mcq-question" id="q${i}">
            <h4>Q${i+1}. ${q.q}</h4>
            ${q.options.map((o, idx) => `<div class="mcq-option" onclick="checkMCQ(this,${idx},${q.answer},'q${i}')">${String.fromCharCode(65+idx)}) ${o}</div>`).join('')}
        </div>`;
    });
    document.getElementById('practice-paper').innerHTML = html;
}

function checkMCQ(el, selected, correct, qId) {
    const options = document.querySelectorAll(`#${qId} .mcq-option`);
    options.forEach((opt, idx) => {
        opt.style.pointerEvents = 'none';
        if(idx === correct) opt.classList.add('correct');
        if(idx === selected && selected !== correct) opt.classList.add('incorrect');
    });
}

function generateSAQPaper() {
    const shuffled = [...saqQuestions].sort(() => Math.random() - 0.5).slice(0, 14);
    let html = '<p style="color:#ffa726;margin-bottom:1rem"><strong>Instructions:</strong> Answer 12 of the following 14 questions. Each question is worth up to 10 marks. Write your answers on paper, then reveal model answers to self-assess.</p>';
    shuffled.forEach((q, i) => {
        html += `<div class="mcq-question">
            <h4>Q${i+1}. [${q.topic.toUpperCase()}] ${q.q}</h4>
            <p style="color:#aaa;font-size:0.85rem;margin:0.5rem 0">(10 marks - aim for 5 key points with examples)</p>
            <textarea style="width:100%;height:100px;background:#0f3460;color:#eee;border:1px solid #4fc3f7;border-radius:8px;padding:1rem;font-family:inherit;resize:vertical" placeholder="Write your answer here..."></textarea>
            <button class="btn btn-secondary" style="margin-top:0.5rem" onclick="this.nextElementSibling.style.display='block'">Reveal Model Answer</button>
            <div style="display:none;margin-top:1rem;padding:1rem;background:#0a1628;border-radius:8px;border-left:3px solid #66bb6a">
                <p style="color:#66bb6a;font-weight:bold">Model Answer (5/5):</p>
                <ul style="color:#ccc;padding-left:1rem">${q.bullets.map(b=>`<li style="margin:0.3rem 0">${b}</li>`).join('')}</ul>
                <p style="color:#ffa726;font-weight:bold;margin-top:0.5rem">Full Example:</p>
                <p style="color:#aaa;font-size:0.85rem">${q.example}</p>
            </div>
        </div>`;
    });
    document.getElementById('practice-paper').innerHTML = html;
}

function renderPodcasts() {
    const topics = getTopics();
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">${currentExam==='mcq'?'MCQ':'SAQ'} - Topic Podcasts</h2>`;
    html += `<p style="color:#aaa;margin-bottom:1rem">Audio explanations of each topic with key examples. Click "Read Aloud" to have your browser read the script (uses text-to-speech), or read the scripts below.</p>`;
    html += renderFilterBar();
    Object.entries(topics).forEach(([category, items]) => {
        if(currentFilter !== 'all' && currentFilter !== category) return;
        html += `<div class="category-header"><h2>${category.charAt(0).toUpperCase()+category.slice(1)}</h2></div>`;
        items.forEach(topic => {
            const podcast = podcastData[topic.id];
            if(!podcast) return;
            html += `<div class="podcast-card">
                <h3>🎧 ${podcast.title}</h3>
                <p>Key concepts, models and memorable examples for ${podcast.title}</p>
                <div class="audio-placeholder">
                    <button class="btn btn-primary" onclick="speakText('${topic.id}')">🔊 Read Aloud</button>
                    <button class="btn btn-secondary" onclick="stopSpeech()" style="margin-left:0.5rem">⏹ Stop</button>
                    <button class="btn btn-secondary" onclick="toggleScript('script-${topic.id}')" style="margin-left:0.5rem">📄 Show Script</button>
                </div>
                <div id="script-${topic.id}" style="display:none;margin-top:1rem;padding:1rem;background:#0f3460;border-radius:8px">
                    <p style="color:#ccc;line-height:1.8">${podcast.script}</p>
                </div>
            </div>`;
        });
    });
    return html;
}

function speakText(topicId) {
    stopSpeech();
    const podcast = podcastData[topicId];
    if(!podcast) return;
    const utterance = new SpeechSynthesisUtterance(podcast.script);
    utterance.rate = 0.9;
    utterance.pitch = 1;
    utterance.lang = 'en-GB';
    speechSynthesis.speak(utterance);
}

function stopSpeech() { speechSynthesis.cancel(); }

function toggleScript(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderTips() {
    const tips = currentExam === 'mcq' ? examTips.mcq : examTips.saq;
    let html = `<h2 style="color:#4fc3f7;margin-bottom:1rem">${currentExam==='mcq'?'MCQ':'SAQ'} Exam Tips</h2>`;
    html += `<div class="stats-panel">
        <h3 style="color:#ffa726">📋 Exam Overview</h3>
        ${currentExam==='mcq' ? 
            '<p style="color:#ccc;line-height:1.8">• Duration: 60 minutes<br>• Questions: 60 multiple choice<br>• Marks: 60 (1 mark per question)<br>• Pass mark: typically 60% (36/60)<br>• No negative marking<br>• Topics: Perspective (Strategy, Compliance), People (Self-reflection, Integrity, Communication, Negotiation, Results), Practice (Design, Requirements, Scope, Procurement, Plan & Control, Risk, Change)</p>' :
            '<p style="color:#ccc;line-height:1.8">• Duration: 120 minutes<br>• Questions: 14 presented, answer 12<br>• Marks: 120 total (10 marks per question, typically 2 sub-parts of 5 marks each)<br>• Pass mark: typically 60% (72/120)<br>• Topics: Perspective (Governance, Power & Interest, Culture), People (Relationships, Leadership, Teamwork, Conflict, Resourcefulness), Practice (Time, Organisation, Quality, Finance, Resources, Stakeholders)</p>'
        }
    </div>`;
    tips.forEach(tip => {
        html += `<div class="tip-card">
            <h3>💡 ${tip.title}</h3>
            <p style="color:#ccc;line-height:1.6">${tip.tip}</p>
        </div>`;
    });
    html += `<div class="tip-card" style="border-left-color:#66bb6a">
        <h3 style="color:#66bb6a">🎯 Quick Revision Checklist</h3>
        <ul style="color:#ccc;line-height:2;padding-left:1.5rem">
            <li>Can I name and explain ALL models for each topic?</li>
            <li>Can I define each competence element in one sentence?</li>
            <li>Do I have a practical example for each topic?</li>
            <li>Can I explain WHY each model/approach is useful (not just WHAT it is)?</li>
            <li>Do I know the difference between similar concepts (QA vs QC, Risk vs Issue, Output vs Outcome)?</li>
            <li>Can I apply models to a scenario (not just describe them)?</li>
            <li>Have I practised under timed conditions?</li>
            <li>Are all my flashcards at GREEN?</li>
        </ul>
    </div>`;
    return html;
}

// ===== INITIALISE =====
timerSeconds = 3600;
render();
</script>
</body>
</html>
