const saqQuestions = [
    // GOVERNANCE
    {topic:'governance',q:'Explain the purpose and key elements of project governance.',bullets:['Governance provides the framework for decision-making, oversight and accountability in projects','Key elements include: project board/steering committee, defined roles (sponsor, PM, team), reporting structure, escalation paths, and stage gates','The project sponsor is the single point of accountability representing business interests','Governance must be proportionate to project size, complexity and risk','Effective governance enables timely decisions, manages risk, ensures alignment to strategy, and provides assurance to stakeholders'],example:'Project governance establishes the framework of authority, accountability, and decision-making to direct and control the project. It typically operates through a project board or steering committee chaired by the sponsor, who is accountable for business case delivery. Key elements include clearly defined roles and responsibilities (using RACI), escalation procedures for issues exceeding tolerance, stage-gate reviews for go/no-go decisions, and regular reporting mechanisms. For example, in an IT transformation programme, the governance board met monthly to review progress against tolerance, approved change requests above £50k, and conducted formal gate reviews before each phase transition. Governance should be proportionate—a small internal project needs lighter governance than a multi-million pound external delivery.'},
    {topic:'governance',q:'Describe the role of a PMO and its different types.',bullets:['PMO = Project/Programme Management Office - provides support, standards and governance','Supportive PMO: provides templates, training and advice but PM retains authority','Controlling PMO: requires compliance with standards, methodologies and reporting','Directive PMO: directly manages projects, PMs report to PMO','PMO functions include: resource management, reporting consolidation, methodology ownership, lessons learned repository, and portfolio prioritisation'],example:'A Project Management Office (PMO) provides centralised support, standards, and governance for project delivery. There are three main types: a Supportive PMO acts as a consultancy, providing templates, tools, and training while project managers retain full authority. A Controlling PMO requires compliance with defined standards, methodologies, and reporting formats. A Directive PMO directly manages projects with PMs reporting into the PMO structure. In practice, a large engineering firm established a Controlling PMO that maintained the methodology, consolidated monthly reporting across 40+ projects, managed the resource pool, maintained the lessons learned database, and supported portfolio prioritisation. The PMO improved delivery predictability from 45% to 78% on-time delivery within 18 months by standardising planning and introducing consistent stage-gate reviews.'},
    {topic:'governance',q:'How does a RACI matrix support effective project governance?',bullets:['RACI = Responsible (does the work), Accountable (approves/owns), Consulted (provides input), Informed (kept updated)','Only ONE person should be Accountable for each task/decision to avoid confusion','Prevents duplication of effort and ensures nothing falls between gaps','Links organisational structure to deliverables and decisions','Should be agreed early and communicated to all stakeholders, reviewed when changes occur'],example:'A RACI matrix clarifies roles by mapping activities against stakeholders using four categories: Responsible (performs the work), Accountable (single point of ownership who approves), Consulted (provides input before decision), and Informed (notified after decision). The critical rule is having only one "A" per row to ensure clear ownership. For example, in a product launch project, the RACI showed marketing was Responsible for campaign development, the Product Director was Accountable, Legal was Consulted for compliance review, and Sales were Informed of launch plans. This prevented the previous confusion where three departments all thought they owned messaging decisions. The matrix was displayed in the project war room and reviewed at each stage gate to accommodate organisational changes.'},
    // POWER & INTEREST
    {topic:'power',q:'Explain how the Power/Interest Grid helps manage stakeholders.',bullets:['The grid maps stakeholders on two axes: power (ability to influence) and interest (level of concern about the project)','High Power/High Interest: Manage Closely - key players, involve in decisions','High Power/Low Interest: Keep Satisfied - could become blockers if ignored','Low Power/High Interest: Keep Informed - advocates and supporters','Low Power/Low Interest: Monitor - minimal effort required, may change position over time'],example:'The Power/Interest Grid (Mendelow\'s Matrix) is a stakeholder analysis tool mapping individuals on two axes: their power to influence the project and their level of interest in it. This creates four quadrants with distinct strategies. High Power/High Interest stakeholders (e.g., project sponsor, key client) are managed closely through regular face-to-face engagement and involvement in decisions. High Power/Low Interest stakeholders (e.g., finance director) are kept satisfied with periodic updates ensuring they don\'t become blockers. Low Power/High Interest stakeholders (e.g., end users) are kept informed as they can become advocates or resistors. Low Power/Low Interest (e.g., general public) are monitored. For example, when delivering a hospital IT system, the clinical director (high power/high interest) was engaged weekly, the CFO (high power/low interest) received monthly financial summaries, and ward nurses (low power/high interest) received regular newsletters and demonstrations.'},
    {topic:'power',q:'Describe French and Raven\'s sources of power and their relevance to project management.',bullets:['Legitimate Power: formal authority from position/role (e.g., sponsor approving budget)','Reward Power: ability to give rewards (e.g., bonuses, recognition, assignments)','Coercive Power: ability to punish (e.g., poor reviews, removal from project) - least sustainable','Expert Power: knowledge and skills that others value (e.g., technical specialist)','Referent Power: personal charisma, respect, admiration that others want to follow','Project managers often rely on Expert and Referent power as they frequently lack formal Legitimate power over team members in matrix organisations'],example:'French and Raven identified six sources of power relevant to project management. Legitimate power comes from formal position—a sponsor can approve budget by authority. Reward power enables giving valued outcomes—a PM recommending a team member for promotion. Coercive power uses fear of consequences—threatening poor performance reviews (least effective long-term). Expert power comes from recognised knowledge—a cybersecurity specialist whose advice is followed because of their expertise. Referent power derives from personal qualities—a PM whose integrity and charisma inspire followership. Informational power comes from access to valuable information. In matrix organisations, PMs typically lack legitimate power over team members who report to functional managers. Therefore, effective PMs build expert power through competence, referent power through relationships, and informational power through being the communication hub. A PM who relies solely on coercive power will quickly lose team commitment.'},

    // CULTURE & VALUES
    {topic:'culture',q:'Explain Hofstede\'s Cultural Dimensions and their impact on project management.',bullets:['Power Distance: degree of acceptance of unequal power distribution - affects decision-making and escalation','Individualism vs Collectivism: impacts team dynamics, reward systems and conflict approaches','Masculinity vs Femininity: affects work-life balance expectations and competitive vs collaborative cultures','Uncertainty Avoidance: influences risk appetite, planning detail and tolerance of ambiguity','Long-term vs Short-term Orientation: affects investment decisions and benefit timelines'],example:'Hofstede\'s Cultural Dimensions framework identifies six dimensions that vary across national cultures, directly impacting project management. Power Distance affects how teams communicate—in high PD cultures (e.g., Japan), team members may not challenge a PM\'s decision, requiring the PM to actively seek input. Individualism/Collectivism affects motivation—individual bonuses work in the US but team rewards suit collectivist cultures like China. Uncertainty Avoidance influences planning—German teams may demand detailed plans while Swedish teams tolerate ambiguity and prefer agile approaches. For example, managing a global IT rollout across UK (low PD, individualist), Japan (high PD, collectivist), and Brazil (high PD, collectivist) required adapting communication from open debate in UK workshops to structured one-to-one sessions in Japan and relationship-building social events in Brazil. The PM adapted governance reporting frequency from monthly (UK) to weekly (Japan) to match uncertainty avoidance preferences.'},
    {topic:'culture',q:'Describe Schein\'s Three Levels of Culture and how a PM can assess project culture.',bullets:['Level 1 - Artefacts: visible elements like office layout, dress code, language, ceremonies - easy to observe but hard to interpret','Level 2 - Espoused Values: stated strategies, goals, philosophies - what the organisation says it values','Level 3 - Basic Assumptions: unconscious, taken-for-granted beliefs - the deepest level, hardest to change','Gaps between espoused values and actual behaviour reveal cultural dysfunction','PMs assess culture through observation, interviews, reviewing documents, and noting what gets rewarded vs punished'],example:'Schein\'s model describes culture at three levels: Artefacts (visible structures—open plan offices, casual dress, daily stand-ups), Espoused Values (stated beliefs—"we value innovation" on posters), and Basic Assumptions (unconscious beliefs—"failure is punished" despite innovation rhetoric). The gap between levels 2 and 3 reveals dysfunction. A PM joining a new organisation assessed culture by observing: meetings started late (artefact suggesting time is flexible), the values statement promoted "empowerment" (espoused), yet every decision required director sign-off (assumption that control is needed). This insight meant the PM adjusted their approach—rather than expecting delegated authority, they built relationships with directors and scheduled pre-meetings to get informal approval. Understanding the real culture (assumptions) rather than the stated culture (values) prevented frustration and enabled effective delivery within the actual operating norms.'},
    // RELATIONSHIPS & ENGAGEMENT
    {topic:'relationships',q:'How can a project manager build and maintain effective stakeholder relationships?',bullets:['Invest time in understanding individual motivations, concerns and communication preferences','Build trust through consistency, competence, follow-through on commitments and transparency','Use formal and informal interactions - coffee conversations are as important as steering committees','Tailor engagement approach to each stakeholder using analysis tools like Power/Interest grid','Maintain relationships proactively - don\'t only engage when you need something or have problems'],example:'Effective stakeholder relationships are built through deliberate, consistent effort. First, the PM invests time understanding each stakeholder\'s motivations—a finance director cares about ROI while an operations manager cares about disruption. Second, trust is built through competence (delivering what you promise), consistency (behaving predictably), and transparency (sharing bad news early). For example, a PM delivering a CRM implementation scheduled monthly formal steering committees but also held informal monthly coffees with each board member, created a stakeholder map updated quarterly, and sent personalised updates addressing each stakeholder\'s specific concerns. When a significant delay occurred, the PM informed the sponsor immediately rather than waiting for the board meeting—this transparency actually strengthened trust. The PM also facilitated introductions between stakeholders who could help each other, creating reciprocal goodwill. Relationship maintenance continued post-project through benefits review meetings.'},
    {topic:'relationships',q:'Explain the Stakeholder Engagement Assessment Matrix and how it guides engagement planning.',bullets:['Maps each stakeholder\'s CURRENT engagement level against DESIRED level','Levels: Unaware, Resistant, Neutral, Supportive, Leading','The gap between current and desired indicates the engagement effort required','Informs specific actions to move stakeholders toward desired engagement','Should be reviewed regularly as engagement levels shift throughout the project lifecycle'],example:'The Stakeholder Engagement Assessment Matrix plots each stakeholder\'s current engagement level (C) against the desired level (D) across five states: Unaware (don\'t know about the project), Resistant (aware but opposed), Neutral (aware but neither supportive nor resistant), Supportive (aware and in favour), and Leading (actively championing). For example, in a digital transformation project: the IT Director was Currently Supportive, Desired Leading—action: involve in steering group and ask to present benefits to peers. The Operations Manager was Currently Resistant, Desired Supportive—action: one-to-one sessions addressing concerns, involve in solution design, demonstrate how system reduces their team\'s manual workload. End Users were Currently Unaware, Desired Supportive—action: awareness campaign, demonstrations, champions network. The matrix was reviewed monthly, and when the Finance Director shifted from Neutral to Resistant after a cost overrun, immediate action was taken to present a revised business case showing long-term savings.'},

    // LEADERSHIP
    {topic:'leadership',q:'Compare Situational Leadership styles and explain when each is appropriate.',bullets:['Directing (S1): high task, low relationship - for low competence/high commitment (new team members)','Coaching (S2): high task, high relationship - for some competence/low commitment (developing but frustrated)','Supporting (S3): low task, high relationship - for high competence/variable commitment (capable but uncertain)','Delegating (S4): low task, low relationship - for high competence/high commitment (experienced self-starters)','The key insight is matching style to follower maturity/readiness - no single style works for all situations'],example:'Hersey and Blanchard\'s Situational Leadership model states that effective leaders adapt their style to followers\' readiness (competence + commitment). S1 Directing provides clear instructions with close supervision—appropriate for a graduate joining their first project who is enthusiastic but lacks skills. S2 Coaching combines direction with explanation and encouragement—suitable for a team member six months in who has some skills but is frustrated by complexity. S3 Supporting offers encouragement and shared decision-making—right for an experienced professional who knows the work but lacks confidence in a new domain. S4 Delegating hands over responsibility—appropriate for a senior specialist who is both capable and motivated. For example, a PM leading a mixed team used S1 with a new analyst (daily task briefings), S2 with a junior developer (pairing sessions explaining rationale), S3 with an experienced BA in a new sector (weekly check-ins, asking their opinion), and S4 with a senior architect (monthly catch-ups, full autonomy). The key is diagnosing readiness correctly and adjusting as people develop.'},
    {topic:'leadership',q:'Explain the difference between leadership and management in a project context.',bullets:['Management focuses on planning, organising, controlling - doing things right (efficiency)','Leadership focuses on vision, inspiration, motivation - doing the right things (effectiveness)','Projects need both: management for delivery discipline, leadership for engagement and change','Good PMs flex between management and leadership depending on situation','Transactional (management) ensures compliance; Transformational (leadership) inspires beyond expectations'],example:'Management and leadership are complementary but distinct. Management is about planning, organising, staffing, and controlling—creating order, consistency, and predictability. Leadership is about establishing direction, aligning people, motivating, and inspiring—producing change and movement. In projects, management ensures the Gantt chart is updated, risks are logged, and budgets tracked. Leadership creates a compelling vision that makes the team want to deliver, resolves conflicts through influence, and navigates organisational politics. For example, a PM delivering a hospital system rebuild demonstrated management by maintaining a detailed integrated plan with 500+ activities, tracking EVM weekly, and running formal change control. They demonstrated leadership by crafting a vision ("zero patient data errors"), personally visiting wards to understand clinician frustrations, publicly recognising team contributions, and coaching a struggling developer rather than replacing them. The project succeeded because management kept it on track while leadership kept people motivated through an 18-month marathon.'},
    // TEAMWORK
    {topic:'teamwork',q:'Describe Tuckman\'s model of team development and the PM\'s role at each stage.',bullets:['Forming: team comes together, polite, uncertain - PM provides clear direction, structure and purpose','Storming: conflict emerges, power struggles, challenge authority - PM facilitates resolution, maintains focus on goals','Norming: team establishes ways of working, cohesion builds - PM encourages collaboration, steps back slightly','Performing: team is autonomous, productive, self-managing - PM delegates, removes obstacles, celebrates success','Adjourning: project ends, team disbands - PM captures lessons, recognises contributions, manages transition'],example:'Tuckman\'s model describes five stages of team development, each requiring different PM behaviours. In Forming, a new cross-functional team was uncertain about roles and expectations—the PM held a kick-off workshop, established a team charter, defined roles using RACI, and set clear short-term objectives. During Storming, two senior developers clashed over architecture approach—the PM facilitated a structured debate, established decision criteria, and helped the team reach consensus while acknowledging both viewpoints. In Norming, the team organically developed daily stand-ups and peer code reviews—the PM reinforced these behaviours and stepped back from directing. At Performing, the team self-organised sprint planning and proactively managed dependencies—the PM focused on removing external obstacles and stakeholder management. During Adjourning, the PM held a retrospective capturing lessons learned, wrote personal references, organised a team celebration, and ensured knowledge transfer to the operational team. Teams can regress—when a key member left during Performing, the team briefly returned to Storming before re-norming.'},
    {topic:'teamwork',q:'Explain Belbin\'s Team Roles and why team diversity matters.',bullets:['Nine roles in three categories: Action (Shaper, Implementer, Completer-Finisher), People (Coordinator, Teamworker, Resource Investigator), Thinking (Plant, Monitor-Evaluator, Specialist)','Each person has preferred roles, manageable roles, and least preferred roles','Balanced teams with diverse roles outperform teams of similar types','Knowing team roles helps allocate tasks, understand conflict sources, and fill gaps','A team of all Plants (creative thinkers) will generate ideas but never implement them'],example:'Belbin identified nine team roles across three categories. Action-oriented roles (Shaper drives progress, Implementer turns ideas into plans, Completer-Finisher ensures quality). People-oriented roles (Coordinator delegates effectively, Teamworker builds harmony, Resource Investigator networks externally). Thinking roles (Plant generates creative ideas, Monitor-Evaluator analyses options objectively, Specialist provides deep expertise). A PM used Belbin assessments when forming a project team and discovered the group was dominated by Shapers and Plants—lots of energy and ideas but poor follow-through. By adding a Completer-Finisher and Implementer, delivery improved dramatically. The PM also used role awareness to manage conflict—recognising that tension between the Shaper (pushing deadlines) and the Monitor-Evaluator (wanting more analysis) was productive role-based tension, not personal conflict. Understanding that no one role is "better" helps teams value diversity and allocate work to natural strengths.'},

    // CONFLICT & CRISIS
    {topic:'conflict',q:'Explain the Thomas-Kilmann Conflict Modes and when each is appropriate.',bullets:['Competing (assertive, uncooperative): use for urgent decisions, safety issues, unpopular but necessary actions','Collaborating (assertive, cooperative): use when both parties\' concerns are too important to compromise, time available','Compromising (moderate assertive, moderate cooperative): use when goals are moderately important, temporary settlement needed','Avoiding (unassertive, uncooperative): use when issue is trivial, no chance of winning, or to let people cool down','Accommodating (unassertive, cooperative): use when you are wrong, issue matters more to others, or to build goodwill'],example:'Thomas-Kilmann identifies five conflict handling modes based on assertiveness and cooperativeness. Competing is appropriate when safety is at risk—a PM insisted on halting construction when structural concerns emerged despite schedule pressure. Collaborating works when creative solutions exist—two departments both needed the same server capacity, and by exploring needs, a cloud-based solution served both better than either original request. Compromising works for time-pressured decisions—splitting a contested budget 60/40 based on relative project criticality. Avoiding is appropriate when emotions are high—postponing a heated design debate until the next morning when participants could think rationally. Accommodating builds relationships—accepting a stakeholder\'s preferred reporting format even though it required extra effort, because the relationship mattered more than efficiency. The key insight is that no single mode is always correct—effective PMs diagnose the situation (urgency, importance, relationship value) and consciously select the appropriate approach rather than defaulting to their natural preference.'},
    {topic:'conflict',q:'Describe how to manage a project crisis effectively.',bullets:['Immediate response: assess the situation factually, establish what is known and unknown, stabilise','Communication: inform sponsor and key stakeholders immediately with facts and planned response','Decision-making: convene crisis team, make rapid decisions with available information, accept imperfect data','Action: implement containment/recovery actions, assign clear ownership, set review checkpoints','Recovery: conduct post-crisis review, capture lessons learned, update risk register, restore confidence'],example:'Crisis management requires rapid, structured response. When a critical supplier went into administration mid-project threatening a 3-month delay to a regulatory deadline, the PM followed a crisis framework. Immediate response: convened emergency steering group within 2 hours, presented factual assessment (what was contracted, what was delivered, what remained, deadline implications). Communication: transparent briefing to sponsor within 1 hour, stakeholder update within 4 hours acknowledging the issue and outlining response plan. Decision-making: crisis team evaluated three options within 48 hours—alternative supplier (6 weeks to onboard), in-house delivery (possible but risky), descope (unacceptable for compliance). Action: selected split approach—brought critical path work in-house immediately while onboarding alternative supplier for remaining scope. Assigned dedicated lead for each workstream with daily progress reporting. Recovery: delivered 2 weeks late (within regulatory grace period), conducted lessons learned identifying earlier warning signs that were missed, updated risk register to include supplier financial health monitoring, and added contract clauses for future procurements.'},
    // RESOURCEFULNESS
    {topic:'resourcefulness',q:'Explain De Bono\'s Six Thinking Hats and how they support creative problem-solving in projects.',bullets:['White Hat: focus on available data and facts - what do we know? what information is missing?','Red Hat: express feelings and intuition without justification - gut reactions and emotions','Black Hat: critical judgement - risks, dangers, what could go wrong (devil\'s advocate)','Yellow Hat: optimistic thinking - benefits, value, what could go right','Green Hat: creative thinking - alternatives, new ideas, possibilities','Blue Hat: process control - manages the thinking process, summarises, decides next steps'],example:'De Bono\'s Six Thinking Hats enables structured creative problem-solving by directing the team to think in one mode at a time, preventing dominant personalities from controlling discussion. When a project faced a seemingly impossible deadline reduction from 12 to 8 months, the PM facilitated a Hats session. White Hat: established facts—current schedule, resource availability, dependencies, contractual constraints. Red Hat: team expressed frustration and anxiety but also excitement about the challenge. Black Hat: identified risks of fast-tracking—quality issues, burnout, rework cycles. Yellow Hat: explored benefits—first-to-market advantage, team capability building, client relationship strengthening. Green Hat: generated creative options—parallel prototyping, reuse of components from previous project, offshore team for documentation, automated testing to reduce QA time, client co-location to eliminate approval delays. Blue Hat: PM summarised, prioritised ideas by feasibility and impact, and created action plan. The result was an innovative approach combining automation, reuse, and co-location that achieved 9.5 months—close enough for client acceptance.'},
    {topic:'resourcefulness',q:'How can Root Cause Analysis techniques be applied to solve project problems?',bullets:['5 Whys: repeatedly asking "why" to drill down from symptom to root cause (typically 5 levels deep)','Ishikawa/Fishbone diagram: categorises causes into groups (People, Process, Technology, Environment, Materials, Measurement)','Pareto Analysis (80/20 rule): identifies the vital few causes responsible for most problems','Distinguishes symptoms from causes - treating symptoms means problems recur','Should lead to preventive action, not just corrective action - update processes/standards'],example:'Root Cause Analysis prevents recurring problems by addressing causes rather than symptoms. The 5 Whys technique is deceptively powerful. Problem: project deliverable rejected by client. Why? Requirements didn\'t match expectations. Why? Requirements were ambiguous. Why? Business analyst didn\'t validate with end users. Why? No user access was arranged. Why? Stakeholder engagement plan didn\'t identify end users as key stakeholders. Root cause: inadequate stakeholder identification process. Fix: enhanced stakeholder identification checklist at project initiation. An Ishikawa diagram was used when a manufacturing project had repeated quality failures. Categories revealed: People (insufficient training), Process (no peer review step), Technology (outdated testing tools), Materials (supplier quality declining). Pareto analysis showed 80% of defects came from two causes—missing peer review and inadequate training. Addressing just these two causes dramatically improved quality. The PM updated the project quality plan AND the organisational methodology to prevent recurrence on future projects—moving from corrective to preventive action.'},

    // TIME
    {topic:'time',q:'Explain the Critical Path Method and its importance in project scheduling.',bullets:['Critical Path = longest sequence of dependent activities through the network = minimum project duration','Activities on the critical path have ZERO float - any delay extends the project end date','Float (slack) = time a non-critical activity can slip without affecting project end date','Forward pass calculates earliest start/finish; backward pass calculates latest start/finish','Float = Late Start - Early Start (or Late Finish - Early Finish)'],example:'The Critical Path Method (CPM) identifies the longest path through a project network diagram, determining the minimum possible duration. Activities on this path have zero float—any delay directly extends the project end date. For example, in a building project with paths: Design(4w)→Foundation(6w)→Structure(8w)→Fit-out(4w) = 22 weeks, and Design(4w)→Procurement(3w)→Fit-out(4w) = 11 weeks. The critical path is 22 weeks through Foundation and Structure. Procurement has 11 weeks of float (22-11). The PM focuses management attention on critical path activities—ensuring foundation contractors are confirmed early, monitoring structure progress daily, and having contingency plans if weather delays foundation work. When the client requested a 2-week schedule reduction, the PM used crashing (adding resources to Structure, reducing it to 6 weeks at extra cost) rather than fast-tracking (which would have required starting Structure before Foundation was complete—impossible for construction). Understanding CPM enables informed trade-off decisions.'},
    {topic:'time',q:'Compare schedule compression techniques: crashing and fast-tracking.',bullets:['Crashing: adding resources to critical path activities to reduce duration - increases COST','Fast-tracking: performing sequential activities in parallel - increases RISK','Crashing only works where additional resources can actually reduce duration (not all tasks are "crashable")','Fast-tracking only works where activities have discretionary (not mandatory) dependencies','Both techniques only apply to critical path activities - compressing non-critical activities doesn\'t help'],example:'When a software project\'s critical path showed delivery 6 weeks late, two compression techniques were evaluated. Crashing: adding two more developers to the 12-week development phase could reduce it to 9 weeks but would cost £45k extra and require 2 weeks onboarding (net saving: 1 week for £45k—poor value). Adding a second testing environment could reduce the 8-week test phase to 5 weeks for £20k (good value—3 weeks saved). Fast-tracking: starting user acceptance testing while system testing was still completing the final module (normally sequential) could save 2 weeks but risked finding integration defects late. Starting training material development parallel to final development (normally waiting for frozen requirements) could save 3 weeks with moderate risk of rework. The PM selected: crash testing environment (3 weeks, £20k, low risk) plus fast-track training materials (3 weeks, moderate risk with mitigation of versioned drafts). Total: 6 weeks recovered within acceptable cost and risk parameters. Key principle: only critical path compression helps; the PM verified each option targeted critical activities.'},
    // ORGANISATION & INFORMATION
    {topic:'organisation',q:'Explain the purpose and benefits of a PMIS (Project Management Information System).',bullets:['PMIS is the integrated system of tools and techniques used to collect, store and distribute project information','Provides single source of truth - prevents conflicting versions of plans, reports and documents','Supports planning (scheduling tools), execution (collaboration), monitoring (dashboards), and control (change logs)','Enables consistent reporting across projects and programmes for portfolio governance','Should be accessible, secure, and proportionate to project complexity'],example:'A Project Management Information System (PMIS) provides the integrated toolset for managing project information throughout the lifecycle. It serves as the single source of truth, preventing the chaos of multiple spreadsheet versions circulating via email. A well-implemented PMIS for a £5M programme included: planning tools (MS Project for scheduling, resource histograms), document management (SharePoint with version control and access permissions), collaboration (Teams channels organised by workstream), monitoring (Power BI dashboards showing EVM metrics, risk heat maps, milestone tracking), and control (digital change request workflow with audit trail). Benefits realised included: 60% reduction in time preparing board reports (automated from live data), zero instances of decisions made on outdated information, full audit trail for regulatory compliance, and consistent reporting enabling meaningful cross-project portfolio comparisons. The PM ensured the system was proportionate—the same organisation used a simple shared drive and weekly email update for projects under £100k. Key success factor: the PMIS must be maintained and used consistently—a brilliant system nobody updates is worthless.'},
    {topic:'organisation',q:'What is configuration management and why is it important in projects?',bullets:['Configuration management identifies, tracks and controls versions of project deliverables and documents','Ensures everyone works from the correct, approved version (configuration item)','Provides audit trail of what changed, when, why, and who approved it','Prevents unauthorised changes to baselined deliverables','Key processes: identification (what to control), control (change process), status accounting (tracking), verification (auditing correctness)'],example:'Configuration management (CM) ensures that project deliverables are identified, controlled, and traceable throughout their lifecycle. It answers: "Are we all working from the same version?" In a software development project, CM covered: source code (Git with branching strategy—feature branches, release branches, main), documents (SharePoint with mandatory check-in/check-out, version numbers following Major.Minor convention), infrastructure configurations (as code, version-controlled), and test environments (documented build configurations). When a production defect occurred, CM enabled the team to identify exactly which code version was deployed, trace back to the change that introduced the defect, identify which test environment had been used, and determine why the defect wasn\'t caught (test environment was version 2.3 while production was 2.4). Without CM, this diagnosis would have been impossible. The CM process included: Configuration Identification (register of all controlled items), Change Control (formal approval before baselined items change), Status Accounting (dashboard showing current version of all items), and Configuration Verification (periodic audits confirming actual matches records).'},

    // QUALITY
    {topic:'quality',q:'Distinguish between Quality Assurance and Quality Control with project examples.',bullets:['Quality Assurance (QA) is process-focused: are we following the right processes to build quality in?','Quality Control (QC) is product-focused: does the deliverable meet the defined standards?','QA is preventive (proactive) - happens during execution; QC is detective (reactive) - happens on outputs','QA activities: process audits, methodology compliance reviews, peer reviews of approach','QC activities: testing, inspections, measurements against acceptance criteria, reviews of deliverables'],example:'Quality Assurance and Quality Control are complementary but distinct. QA asks "are we doing things right?" (process focus, preventive). QC asks "did we make it right?" (product focus, detective). In a construction project: QA activities included auditing that the approved methodology was followed, reviewing that qualified personnel performed specialist tasks, checking that calibrated equipment was used, and verifying that material certificates were obtained before use. QC activities included physical inspection of completed steelwork against drawings, concrete cube strength testing at 7 and 28 days, dimensional surveys against tolerances, and client witness inspections at hold points. The PM understood that investing in QA (prevention) reduces QC failures (detection). When quality audits revealed that subcontractor method statements weren\'t being reviewed before work started (QA failure), this was corrected immediately—preventing what would have been expensive rework discovered only at inspection (QC failure). The Cost of Quality model shows prevention costs (training, QA) are far cheaper than failure costs (rework, warranty claims, reputation damage).'},
    {topic:'quality',q:'Explain the Cost of Quality model and its implications for project management.',bullets:['Prevention costs: training, quality planning, process design, tools - invest upfront to avoid failures','Appraisal costs: testing, inspections, audits, reviews - detecting defects before delivery','Internal failure costs: rework, retesting, scrap, delays - defects found before customer receives product','External failure costs: warranty, returns, reputation damage, legal - defects found by customer (most expensive)','Optimal quality investment: increase prevention spend to reduce total cost of quality (prevention + appraisal < failure costs)'],example:'The Cost of Quality model categorises quality-related costs into four groups with a clear message: invest in prevention. Prevention costs (5-10% of project budget) include training teams, developing quality plans, designing robust processes, and tool investment. Appraisal costs (10-15%) include testing, inspections, peer reviews, and audits. Internal failure costs (15-25%) include rework, retesting, scrap, and delay. External failure costs (25-50%+) include warranty claims, product recalls, legal action, and reputation damage. A software company tracked these costs: spending £10k on automated testing tools (prevention) and £20k on code review processes (prevention) reduced defect rates from 15 to 3 per release. This eliminated approximately £150k in customer-facing defects (external failure) and £80k in late-stage rework (internal failure). The ROI on quality prevention was 7:1. The implication for PMs is clear: quality cannot be "inspected in" at the end—it must be "built in" through prevention. Cutting quality prevention budget to save money typically increases total project cost through exponentially higher failure costs.'},
    // FINANCE
    {topic:'finance',q:'Explain Earned Value Management (EVM) and how it integrates scope, time and cost measurement.',bullets:['PV (Planned Value): budgeted cost of work SCHEDULED to be done by now','EV (Earned Value): budgeted cost of work actually PERFORMED/completed','AC (Actual Cost): actual cost incurred for work performed','SV = EV - PV (negative = behind schedule); CV = EV - AC (negative = over budget)','SPI = EV/PV (< 1 = behind); CPI = EV/AC (< 1 = over budget); EAC = BAC/CPI (forecast final cost)'],example:'Earned Value Management integrates scope, schedule, and cost into a single measurement framework. Consider a project to build 10 identical modules, each budgeted at £10k (BAC = £100k), planned to complete 1 per week. At week 6: PV = £60k (6 modules should be done), EV = £50k (5 modules actually complete), AC = £55k (actually spent £55k). SV = £50k - £60k = -£10k (behind schedule by one module). CV = £50k - £55k = -£5k (over budget). SPI = 50/60 = 0.83 (only achieving 83% of planned schedule progress). CPI = 50/55 = 0.91 (getting only 91p of value for every £1 spent). EAC = £100k / 0.91 = £110k (forecast to finish £10k over budget if trend continues). This single framework told the PM and sponsor: we are behind AND over budget. The PM investigated and found that modules were taking longer due to design complexity (schedule) and requiring overtime to attempt catch-up (cost). Corrective actions included simplifying remaining module designs and adding a contractor for one sprint rather than continuing overtime.'},
    {topic:'finance',q:'Compare different cost estimating techniques and when each is appropriate.',bullets:['Analogous (top-down): uses similar past projects - quick, less accurate, good for early estimates when detail is lacking','Parametric: uses statistical relationships (e.g., cost per square metre) - accurate if good historical data exists','Bottom-up: estimates each work package then aggregates - most accurate but time-consuming, needs WBS','Three-point: uses Optimistic + 4×Most Likely + Pessimistic / 6 (PERT formula) - accounts for uncertainty','Accuracy improves as project progresses: Cone of Uncertainty narrows from -25%/+75% at concept to ±5% at execution'],example:'Estimating techniques vary in accuracy and effort, suited to different project stages. At concept stage, a construction company used Analogous estimating—"our last similar office building cost £2,500/sqm, so 5,000sqm ≈ £12.5M"—accuracy ±40%, took 2 hours. At feasibility, Parametric estimating refined this—using regression analysis of 50 previous builds accounting for location, specification grade, and ground conditions—accuracy ±25%, took 2 days. At detailed design, Bottom-up estimating priced each package from the WBS—foundations £800k, steelwork £1.2M, etc.—accuracy ±10%, took 3 weeks. Three-point estimating was applied to uncertain packages: the ground works estimate used Optimistic £600k, Most Likely £800k, Pessimistic £1.4M, giving PERT estimate of £867k with quantified risk. The PM added contingency (10% for known unknowns) and the sponsor held management reserve (5% for unknown unknowns). This layered approach meant early decisions used appropriate (not false) precision while detailed planning achieved budget confidence.'},

    // RESOURCES
    {topic:'resources',q:'Explain resource levelling and resource smoothing and when each technique is used.',bullets:['Resource Levelling: resolves over-allocation by delaying activities - MAY EXTEND project end date','Resource Smoothing: redistributes work within available float - MAINTAINS project end date','Levelling is used when resource constraints are the priority (limited specialists, fixed team size)','Smoothing is used when the end date is the priority but resource peaks should be reduced','Both techniques use float on non-critical activities; levelling may also delay critical activities'],example:'Resource levelling and smoothing address over-allocation differently. In a software project, two critical developers were each allocated to 150% capacity in weeks 4-6 (assigned to multiple parallel activities). Resource Levelling approach: delayed the lower-priority activity to weeks 7-9 when the developer was free. Result: resource conflict resolved but project extended by 3 weeks (the delayed activity was on a near-critical path that became critical). This was acceptable because the alternative—hiring contractors—would cost £30k and introduce knowledge transfer risk. Resource Smoothing approach (used for a different over-allocation): a tester was at 120% in week 8 but had float on their assigned activities. By starting one test activity 2 days earlier (using its 5 days of float), the peak reduced to 100% without affecting the end date. Decision logic: if the end date is contractually fixed with penalties, use smoothing (and accept remaining minor over-allocation or fund overtime). If resources are genuinely unavailable (specialist on leave, single qualified person), levelling is the only option—then communicate schedule impact to sponsor for decision.'},
    {topic:'resources',q:'How should a project manager handle resource conflicts in a matrix organisation?',bullets:['Matrix organisations = team members report to functional managers but work on projects - dual reporting creates tension','Resource conflicts arise when functional priorities compete with project needs','PM must negotiate with functional managers - relationship and influence skills critical','Escalation path should be defined in governance (e.g., portfolio board arbitrates)','Tools: resource agreements at initiation, regular resource review meetings, skills matrix for alternatives, early visibility of future needs'],example:'In matrix organisations, PMs lack direct authority over team members who report to functional managers, creating inherent resource conflicts. A PM leading a product development project needed a senior data architect 4 days/week for 3 months, but the functional IT manager only offered 2 days due to operational demands. Resolution approach: 1) Built relationship with IT manager through regular coffee meetings (influence without authority), 2) Presented business case showing project ROI and timeline impact of reduced allocation, 3) Offered flexibility—full allocation for critical 4-week design phase, then reduced allocation with defined touchpoints, 4) Identified a junior architect who could handle routine tasks with senior oversight (reducing senior demand to 3 days), 5) Escalated to portfolio board only when initial negotiation stalled, presenting options with trade-offs. Preventive measures included: resource agreements signed by functional managers at project initiation, 12-week rolling resource forecast shared monthly giving early warning, skills matrix identifying backup personnel, and quarterly resource review with all functional heads to resolve emerging conflicts before they become crises.'},
    // STAKEHOLDERS
    {topic:'stakeholders',q:'Describe a comprehensive stakeholder management process for a project.',bullets:['Identify: use multiple techniques (brainstorming, organisational charts, category checklists) to find ALL stakeholders','Analyse: assess power, interest, attitude, influence - understand what matters to each stakeholder','Plan: develop engagement strategy tailored to each stakeholder or group','Engage: execute the plan through appropriate communication, involvement and relationship management','Monitor: regularly reassess stakeholder positions and adjust strategies - attitudes change over time'],example:'Effective stakeholder management follows a systematic process. For a city centre redevelopment project: IDENTIFY used multiple lenses—organisational (council, developers, contractors), community (residents, businesses, schools), regulatory (planning authority, environment agency, highways), and interest groups (heritage society, disability access groups, environmental campaigners). This identified 47 stakeholder groups. ANALYSE used Power/Interest grid mapping each group, supplemented by one-to-one interviews with key individuals to understand their specific concerns, success criteria, and communication preferences. PLAN developed tailored strategies: the planning authority (high power/high interest) received weekly design updates and early consultation on changes; local businesses (low power/high interest) received monthly newsletters and quarterly open days; the heritage society (medium power/high interest) was invited to join a design advisory panel. ENGAGE executed through dedicated community liaison officer, project website with progress updates, monthly stakeholder newsletter, quarterly public exhibitions, and formal consultation periods. MONITOR reviewed stakeholder map monthly—when a residents\' group shifted from Neutral to Resistant after noise complaints, immediate action included revised working hours, acoustic barriers, and personal visits from the site manager.'},
    {topic:'stakeholders',q:'Explain how to manage negative or resistant stakeholders.',bullets:['Understand the root cause of resistance - is it rational (valid concerns) or emotional (fear of change)?','Engage early and directly - avoidance allows resistance to grow and spread','Listen actively to concerns - people need to feel heard before they will engage','Address legitimate concerns where possible - adapt the project to reduce negative impact','Use appropriate strategies: education, involvement, facilitation, negotiation, or as last resort, mandating with senior authority'],example:'Managing resistant stakeholders requires understanding and addressing root causes rather than ignoring or overriding opposition. In an ERP implementation, the Operations Director was actively undermining the project—spreading negativity, withholding resources, and challenging every decision at steering committee. The PM\'s approach: 1) One-to-one meeting to listen without defending—discovered his resistance stemmed from a previous failed IT project that disrupted operations for 6 months and damaged his department\'s performance metrics. 2) Acknowledged the validity of his concerns—previous project had genuinely caused problems. 3) Addressed concerns specifically—presented phased rollout plan with operational continuity guarantees, offered his team involvement in testing and go/no-go decisions, and committed to rollback capability. 4) Gave him visible influence—invited him to co-chair the operational readiness workstream. 5) Delivered on promises—first phase went smoothly, building trust incrementally. Within 3 months he moved from Resistant to Supportive, eventually becoming a champion because his concerns had been genuinely addressed, not dismissed. Had this failed, escalation to sponsor with evidence would have been the next step, but building genuine buy-in is always preferable to mandating compliance.'}
